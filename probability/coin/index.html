<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동전 실험실 · 확률 실험실</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#12163A">
<meta name="description" content="동전 하나로 배우는 확률 — 패턴, 큰 수의 법칙, 진짜 무작위의 모양">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#12163A; --panel:#1D2257; --panel2:#262C6B; --line:#323A8A; --deep:#161B4A; --edge:#232A70;
  --text:#F4F6FF; --muted:#AEB6F0; --yellow:#FFD23F; --green:#5BD97F; --orange:#FF8A2B;
  --pink:#FF6FAE; --blue:#8C9BFF; --ink:#12163A; --bad:#FF8A8A;
}
*{box-sizing:border-box}
html{background:#0C0F2B}
body{margin:0;background:#0C0F2B;color:var(--text);font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:16px;line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.jua{font-family:'Jua','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:400}
.app{min-height:calc(100vh - var(--labbar-h,0px));background:var(--bg)}
.wrap{max-width:1200px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 머리글 */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:2px solid var(--edge);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand small{display:block;font-size:13px;color:var(--muted)}
.brand b{font-family:'Jua','Noto Sans KR',sans-serif;font-size:26px;font-weight:400;line-height:1.1}
.ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted)}

/* 버튼 */
.go{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:var(--yellow);color:var(--ink);font-family:'Jua','Noto Sans KR',sans-serif;font-size:22px;padding:0 28px;min-height:52px;text-decoration:none}
.go:hover{filter:brightness(1.06)}
.go:disabled{background:var(--line);color:var(--muted);cursor:default;font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:500;filter:none}
.go.sm{min-height:44px;font-size:18px;padding:0 20px}
.go.big{min-height:64px;font-size:28px;padding:0 40px}
.ghost{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:var(--line);color:var(--text);font-family:'Jua','Noto Sans KR',sans-serif;font-size:18px;min-height:44px;padding:0 18px;text-decoration:none}
.ghost:hover{background:#3C45A0}
.ghost:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;color:var(--muted);font-size:15px;text-decoration:underline;padding:6px}
.pick{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--line);border-radius:18px;background:var(--panel2);color:var(--text);font-family:'Jua','Noto Sans KR',sans-serif;font-size:32px;min-width:150px;min-height:84px;padding:0 24px}
.pick.h{border-color:var(--yellow)}
.pick.t{border-color:var(--blue)}
.pick:hover:not(:disabled){background:#313983}
.pick:disabled{opacity:.5;cursor:default}
.pick.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}

/* 판 */
.panel{background:var(--panel);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2,.panel h3{margin:0;font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
.panel h2{font-size:26px}
.panel h3{font-size:21px}
.hint{margin:0;font-size:15px;color:var(--muted);line-height:1.55}
.hint b,.panel b{color:var(--text)}
.msg{font-size:16px;color:var(--muted);min-height:24px}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--green)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}

/* 시작 화면 */
.intro h1{margin:0 0 6px;font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.2}
.intro p{margin:0;color:var(--muted);max-width:640px}
.who{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin:20px 0 24px}
.who label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.lives{display:flex;align-items:center;gap:8px;padding:2px 14px;border-radius:999px;background:var(--deep);border:2px solid var(--bad)}.lives small{font-size:14px;color:var(--muted)}.lives span{font-size:38px;line-height:1.2;letter-spacing:4px;color:var(--bad)}.lives i{font-style:normal;opacity:.45}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.ptop h2{margin:0}
.istage{background:var(--deep);margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.igrid{display:grid;grid-template-columns:minmax(220px,1fr) 40px minmax(0,1.6fr);align-items:center;gap:8px}
.icoin{display:flex;flex-direction:column;align-items:center;gap:8px}
.icwrap{height:150px;display:flex;justify-content:center;align-items:center}
.imsg{margin:0;text-align:center;font-size:18px;min-height:3em}
.icalc{padding:12px 16px;border-radius:12px;background:var(--panel);font-size:22px;text-align:center;line-height:1.6}.icalc b{color:var(--yellow)}
.ihist{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;font-size:15px}.ihist span{padding:5px 10px;border-radius:8px;background:var(--panel);color:var(--muted)}.ihist span.now{background:var(--yellow);color:var(--ink);font-weight:700}
.iarrow{font-size:34px;color:var(--yellow);text-align:center}
.istage .seq{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:30px}.istage .cc{width:28px;max-width:28px;font-size:13px}
@media(max-width:700px){.igrid{grid-template-columns:minmax(0,1fr)}.iarrow{transform:rotate(90deg);height:30px}}
.who.mine{align-items:center}.me1{font-size:20px;font-weight:700;padding:8px 14px;border-radius:12px;background:var(--deep);border:2px solid var(--line)}
.who select{height:46px;border-radius:12px;border:2px solid var(--line);background:var(--deep);padding:0 12px;min-width:160px;font-size:17px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--panel);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .no{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--yellow);color:var(--ink);font-family:'Jua',sans-serif;font-size:22px}
.card h3{margin:0;font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:24px}
.card .tag{font-size:13px;font-weight:700;color:var(--yellow);letter-spacing:.02em}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.card .row{margin-top:6px}
.foot{margin-top:28px;font-size:14px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.foot a{color:var(--muted)}

/* 동전 */
.stage{perspective:700px;display:flex;justify-content:center;padding:10px 0 6px}
.coin{width:190px;height:190px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3A4150;background:radial-gradient(circle at 34% 28%,#FAFBFD 0,#D5DAE3 45%,#A9B1BF 100%);border:6px solid #8A93A3;box-shadow:inset 0 0 0 4px rgba(255,255,255,.6),inset 0 0 16px rgba(40,48,70,.35)}
.face::after{content:'';position:absolute;inset:7px;border-radius:50%;border:2px dotted rgba(58,65,80,.45);pointer-events:none}
.face svg.art{width:108px;height:108px;display:block;margin-top:-4px}
.face .cap{font-family:'Jua','Noto Sans KR',sans-serif;font-size:36px;line-height:1;margin-top:-2px}
.face.b{transform:rotateX(180deg)}
.chip,.cc{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;line-height:1;width:100%;aspect-ratio:1;max-width:42px;font-size:15px}
.cc.h{background:var(--yellow);color:var(--ink)}
.cc.t{background:transparent;border:2px solid var(--blue);color:var(--blue)}
.cc.x{box-shadow:0 0 0 3px var(--bad)}
.cc.s{width:24px;max-width:24px;font-size:11px}
.cc.s.t{border-width:1.5px}
.seq{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;justify-items:center}
.seq.mini{display:flex;flex-wrap:wrap;gap:3px}
.cols{display:flex;flex-wrap:wrap;gap:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:42px}
.col .m{font-size:13px;font-weight:700;height:16px}
.col .m.ok{color:var(--green)}
.col .m.no{color:var(--bad)}
.rowlab{font-size:13px;color:var(--muted)}
.bigscore{font-family:'Jua',sans-serif;font-size:54px;line-height:1;color:var(--yellow)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat div{background:var(--deep);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--text);font-family:'Jua',sans-serif;font-weight:400}

/* 슬라이더·입력 */
.field{display:flex;flex-direction:column;gap:6px}
.field .lab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:15px;color:var(--muted)}
.field .lab b{color:var(--yellow);font-family:'Jua',sans-serif;font-weight:400;font-size:20px}
input[type=range]{width:100%;accent-color:var(--yellow);height:22px;margin:0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps .panel{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.steps h3{margin:0;font-size:18px}
.steps .hint{margin:0;font-size:13px}
.steps input[type=number]{width:84px;height:36px;font-size:16px}
.sumbar{display:flex;flex-direction:row;justify-content:flex-start;flex-wrap:wrap;gap:6px 22px;align-items:center;margin-bottom:14px;font-size:16px}
.sumbar b{color:var(--yellow);font-family:'Jua',sans-serif;font-weight:400;font-size:20px}
.wopts{display:flex;flex-direction:column;gap:6px}
.wopts label{cursor:pointer}
.wopts input{position:absolute;opacity:0;pointer-events:none}
.wopts span{display:block;padding:7px 14px;border-radius:12px;background:var(--deep);border:2px solid transparent;color:var(--muted);font-family:'Jua',sans-serif;font-size:19px;text-align:center}
.wopts input:checked+span{border-color:var(--yellow);color:var(--yellow);background:rgba(255,210,63,.1)}
.wopts input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:2px}
.explain{background:var(--deep);border-radius:12px;padding:10px 14px;line-height:1.75}
.two.solo{grid-template-columns:minmax(0,1fr)}
input[type=text],input[type=number]{height:46px;border-radius:12px;border:2px solid var(--line);background:var(--deep);padding:0 14px;font-size:18px;min-width:0}
input[type=number]{width:110px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--deep);color:var(--muted);font-size:14px}
.seg input:checked+span{background:var(--yellow);color:var(--ink);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:2px}

/* 그래프 */
.chartbox{background:var(--deep);border-radius:16px;padding:10px 10px 4px;min-width:0}
.chartbox svg{display:block;width:100%;height:auto}
svg text{font-family:'Noto Sans KR',sans-serif;fill:var(--muted);font-size:13px}
svg .lab{fill:var(--text);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:6px 6px 8px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* 표 */
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{font-size:13px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--edge);vertical-align:middle}
.tbl td.rk{font-family:'Jua',sans-serif;font-size:22px;color:var(--yellow);width:56px}
.tbl tr.me td{background:rgba(255,210,63,.1)}
.tbl .big{font-family:'Jua',sans-serif;font-size:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;border-radius:999px;background:var(--deep);color:var(--muted);padding:9px 16px;font-size:15px}
.tab.on{background:var(--yellow);color:var(--ink);font-weight:700}
.pager{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:48px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.bar .track{position:relative;height:18px;background:var(--deep);border-radius:6px}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--yellow);border-radius:6px}
.bar .th{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--pink);border-radius:2px}

/* 내기 점 격자 */
.dots{display:grid;grid-template-columns:repeat(50,minmax(0,1fr));gap:2px}
.dots i{aspect-ratio:1;border-radius:2px;background:#2A3070}
.dots i.ok{background:var(--green)}
.dots i.no{background:#3B4390}
.betgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.bet{background:var(--deep);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;border:3px solid transparent;min-width:0}
.bet.win{border-color:var(--green)}
.bet .ab{font-family:'Jua',sans-serif;font-size:28px;color:var(--yellow);line-height:1}
.bet p{margin:0;font-size:17px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="/me-sync.js"></script>
<script src="https://mtryu-lab.vercel.app/lab-bar.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="crane" viewBox="0 0 100 100">

  </g>

<div class="app">
  <div class="wrap">
    <header class="hdr">
      <div class="brand">
        <svg width="42" height="42" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="19" fill="#C9CFD9" stroke="#8A93A3" stroke-width="2.5"/><circle cx="21" cy="21" r="15" fill="none" stroke="#fff" stroke-opacity=".6" stroke-dasharray="1.5 2.5"/><svg x="7" y="7" width="28" height="28" viewBox="0 0 100 100" style="color:#3A4150"><use href="#crane"/></svg></svg>

      </div>
      <div class="ctx" id="ctx"></div>
    </header>
    <main id="screen" aria-live="polite"></main>
  </div>

<script>
/* =====================================================================
   선생님 설정  ← 여기만 고치면 돼요
   ===================================================================== */
const CONFIG = {
  years:     [2026],              // 처음에 보여줄 학년도 (강 건너기의 관리자 모드에서 바꾼 목록을 그대로 써요)
  schools:   ['선운중학교'],        // 처음에 보여줄 학교
  apiUrl:    '/api/coin',         // 순위 저장 서버 주소 (서버가 없으면 이 컴퓨터에만 저장돼요)
  configUrl: '/api/config',       // 학년도·학교 목록 서버 주소 (강 건너기와 같아요)
  pageSize:  10                   // 순위표 한 쪽에 보여줄 인원
};
/* ===================================================================== */

(function () {
'use strict';

/* ---------- 도구 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => (typeof requestAnimationFrame === 'function' ? requestAnimationFrame(() => r()) : setTimeout(r, 16)));
const rid = () => Math.random().toString(36).slice(2, 10);
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

/* 진짜 동전: 브라우저의 암호용 난수를 써요 (Math.random보다 예측하기 어려워요) */
function randBits(n) {
  const o = new Uint8Array(n);
  try {
    const a = new Uint8Array(Math.ceil(n / 8));
    crypto.getRandomValues(a);
    for (let i = 0; i < n; i++) o[i] = (a[i >> 3] >> (i & 7)) & 1;
  } catch (e) { for (let i = 0; i < n; i++) o[i] = Math.random() < 0.5 ? 1 : 0; }
  return o;
}
function bitsToHex(b) {
  let s = '';
  for (let i = 0; i < b.length; i += 4) s += (((b[i] << 3) | ((b[i + 1] || 0) << 2) | ((b[i + 2] || 0) << 1) | (b[i + 3] || 0))).toString(16);
  return s;
}
function hexToBits(h) {
  const o = new Uint8Array(h.length * 4);
  for (let i = 0; i < h.length; i++) { const v = parseInt(h[i], 16) || 0; o[4 * i] = (v >> 3) & 1; o[4 * i + 1] = (v >> 2) & 1; o[4 * i + 2] = (v >> 1) & 1; o[4 * i + 3] = v & 1; }
  return o;
}

/* ---------- 계산 (api/_coinlib.js와 같은 식이에요. 둘을 같이 고쳐 주세요) ---------- */
const MAXRUN = 30;                               // 연속 맞추기 최대 횟수
const FLIPS = 1000;                              // 상대도수 줄타기에서 던지는 횟수
const SPOT_ROUNDS = 8, SPOT_LEN = 40, MINE_LEN = 50;
const ODD = 0.025;                               // 내가 만든 배열 판정: 진짜 동전이라면 이 정도로 드문 모양이면 의심해요
const runPoints = n => (n <= 0 ? 0 : 200 * Math.pow(2, n - 1));

/* 던진 횟수 n에서 앞면 비율이 0.5±w% 밖이었던 마지막 때 + 1  (끝까지 못 들어오면 1001) */
function settleTime(bits, w) {
  let heads = 0, last = 0;
  for (let i = 0; i < bits.length; i++) {
    heads += bits[i];
    const n = i + 1;
    if (Math.abs(2 * heads - n) * 100 > 2 * w * n) last = n;
  }
  return last + 1;
}

function derive(g, p) {

  if (g.startsWith('tune')) { const f = settleTime(hexToBits(p.bits), p.w); return { first: f, diff: Math.abs(p.pred - f) }; }
  if (g === 'bet') { let hits = 0; p.rounds.forEach(r => { if (betRound(r).ok) hits++; }); return { score: hits, hits }; }
  return {};
}

  if (game === 'run') payload = { seq: g.flips.join(''), guess: g.guess.join('') };
  else if (game === 'tune') { payload = tunePayload(); game = 'tune' + g.w; }
  else if (game === 'spot') payload = { correct: g.correct };
  else if (game === 'bet') payload = { rounds: g.rounds.map(r => ({ i: r.i, f: r.f, p: r.p })) };
  else return;
  const setRec = (cls, html, retry) => {
    g.recView = { cls, html, retry };
    if (G !== g) return;
    const m = $('#rmsg'), b = $('#recbtn');
    if (m) { m.className = 'msg' + (cls ? ' ' + cls : ''); m.innerHTML = html; }
    if (b) b.style.display = retry ? '' : 'none';

  const name = cleanName(S.name);
  if (!name || badName(name)) { setRec('err', '이름이 올바르지 않아서 올리지 못했어요. 처음 화면에서 이름을 다시 써 주세요.', false); return; }
  g.saving = true; setRec('', '기록을 올리는 중…', false);
  try {
    const id = rid();
    enforceMine();
    const r = await Store.save(game, S.year, S.school, Object.assign({ id, name, ts: Date.now(), uid: ME ? ME.uid : undefined }, payload));
    g.recorded = true; g.saving = false; g.lastId = id;
    setRec('ok', `<b>${esc(name)}</b> 님의 기록이 자동으로 올라갔어요! <b>${r.rank}위</b> (${esc(S.school)}${g.game === 'tune' ? ' · 범위 ' + wText(g.w) : ''} 기록 ${r.total}개 중) · ${Store.mode === 'server' ? '학교 전체 기록' : '이 컴퓨터에만 저장'}` +
      ` <button type="button" class="linkbtn" data-act="board" data-g="${g.game}">순위표 보기</button>`, false);
  } catch (e) {
    g.saving = false;
    setRec('err', e && e.status === 400 ? '서버가 이 기록을 받지 않았어요. 처음 화면에서 이름을 바꿔 보세요.' : '순위에 올리지 못했어요. 인터넷을 확인하고 다시 눌러 주세요.', true);
  }
}

async function runGuess(v) {

  for (let n = 0; n <= FLIPS; n += CH.step) s += `<line x1="${cx(n)}" x2="${cx(n)}" y1="${CH.t}" y2="${CH.t + ph}" stroke="#2A3070" stroke-width="1"/><text x="${cx(n)}" y="${CH.t + ph + 20}" text-anchor="middle">${n}</text>`;

  else if (act === 'practice') { if (!checkName()) return; if (gk === 'spot') startSpot('practice'); else startBet('practice'); }
  else if (act === 'board') { S.vschool = null; B.game = gk; B.q = ''; B.matches = null; if (gk === 'tune' && G && G.game === 'tune') B.w = G.w; go('board'); }
  else if (act === 'b-w') { B.w = parseInt(v, 10); B.q = ''; $('#screen').innerHTML = boardShell(); loadBoard(0); }
  else if (act === 'b-tab') { B.game = gk; B.q = ''; $('#screen').innerHTML = boardShell(); loadBoard(0); }
  else if (act === 'b-page') loadBoard(Math.max(0, parseInt(b.dataset.o, 10) || 0));
  else if (act === 'b-find') {
    const q = cleanName($('#fq').value); B.q = q;
    if (!q) { B.matches = null; paintBoard(); return; }
    Store.find(bk(B.game), S.year, viewSchool(), q).then(m => { B.matches = m; paintBoard(); });
  }
  else if (act === 'guess') runGuess(v);
  else if (act === 'again') startRun();
  else if (act === 'record') autoRecord();
  else if (act === 't-start') tuneRun();
  else if (act === 't-skip') { G.skip = true; if (G.introWait) G.introWait(); }
  else if (act === 't-ithrow') { if (G.introWait) G.introWait(); }
  else if (act === 't-introskip') { G.skipIntro = true; if (G.introWait) G.introWait(); const bx = $('#istage'); if (bx) bx.remove(); const tw = $('#twoWrap'); if (tw) tw.style.display = ''; }
  else if (act === 't-again') tuneRun();
  else if (act === 't-reset') startTune(true);
  else if (act === 's-mode') { startSpot(v); }
  else if (act === 's-pick') { const c = G.cur; if (c.pick === null) { c.pick = v; if (v === c.real) G.correct++; else if (G.mode === 'play') G.wrong++; $('#screen').innerHTML = spotHTML(); } }
  else if (act === 's-next') {
    if (G.mode === 'play') { if (G.wrong >= LIVES) G.over = true; else { G.round++; newSpotRound(); } }
    else { G.round++; if (G.round < SPOT_ROUNDS) newSpotRound(); }
    $('#screen').innerHTML = spotHTML(); window.scrollTo(0, 0);
    if (G.mode === 'play' && G.over) autoRecord();
  }
  else if (act === 's-again') startSpot('play');
  else if (act === 'm-add') { if (G.mine.length < MINE_LEN) { G.mine.push(parseInt(v, 10)); $('#screen').innerHTML = spotHTML(); } }
  else if (act === 'm-undo') { G.mine.pop(); $('#screen').innerHTML = spotHTML(); }
  else if (act === 'm-again') { G.mine = []; $('#screen').innerHTML = spotHTML(); }
  else if (act === 'b-pick') { G.cur.p = v; $('#screen').innerHTML = betHTML(); }
  else if (act === 'b-go') betRun();
  else if (act === 'b-mode') startBet(v);
  else if (act === 'b-next') {
    if (G.mode === 'play') { if (G.wrong >= LIVES) G.over = true; else { G.round++; newBetRound(); } }
    else { G.round++; if (G.round < BET_PRACTICE) newBetRound(); }
    $('#screen').innerHTML = betHTML(); window.scrollTo(0, 0);
    if (G.mode === 'play' && G.over) autoRecord();
  }
  else if (act === 'b-again') startBet('play');
});
document.addEventListener('input', e => {
  const el = e.target, g = G;
  if (el.name === 'wsel' && g && g.game === 'tune') { g.w = parseInt(el.value, 10); $('#chartbox').innerHTML = chartSVG(g) + $('#chartbox').querySelector('.legend').outerHTML; $('#whint').textContent = WHINT(g.w); }
  else if ((el.id === 'pr' || el.id === 'pn') && g && g.game === 'tune') {
    let v = parseInt(el.value, 10); if (!(v >= 1)) { if (el.id === 'pn') return; v = 1; } v = Math.min(FLIPS, v); g.pred = v;
    if (el.id === 'pr') $('#pn').value = v; else $('#pr').value = v;
    $('#plab').textContent = v + '번'; $('#gmarks').innerHTML = markLines(g);
  }
  else if (el.id === 'er' && g && g.game === 'bet') { g.cur.e = parseInt(el.value, 10); $('#elab').textContent = g.cur.e + '%'; }
  else if (el.id === 'myname') { S.name = cleanName(el.value); const e = $('#nameerr'); if (e) e.textContent = ''; }
  else if (el.id === 'spr') { S.speed = parseInt(el.value, 10); const l = $('#slab'); if (l) l.textContent = SPEEDS[S.speed]; savePrefs(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'bSchool') { S.vschool = el.value === S.school ? null : el.value; B.q = ''; $('#screen').innerHTML = boardShell(); loadBoard(0); }
  else if (el.id === 'intro') { S.intro = el.checked; }
  else if (el.id === 'selYear') { S.year = parseInt(el.value, 10); savePrefs(); probeMode(); }
  else if (el.id === 'selSchool') { if (ME) S.vschool = el.value === S.school ? null : el.value; else S.school = el.value; savePrefs(); probeMode(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'fq') { const b = document.querySelector('[data-act=b-find]'); if (b) b.click(); }
});

/* ---------- 내 정보 (me-sync.js · lab-bar.js) ----------
   내 정보가 있으면 기록은 항상 내 학교·내 별명으로 올라가요. 학교 드롭다운은 다른 학교 순위를 볼 때만 써요.
   순위에 올라가는 이름은 별명이고, 실명·학번은 이 게임에 오지 않아요. */
async function syncMe() {
  const m = MtryuMeSync.read();
  if (!m) { ME = null; return; }   // 정보가 없으면 lab-bar.js가 입력창을 띄워 둬요
  let r;
  try { r = await MtryuMeSync.resolve(LIST.schools, LIST.regions, CONFIG.configUrl); } catch (e) { r = { me: m, label: null, retry: true }; }
  if (r && r.list && okList(r.list)) { LIST.years = r.list.years.slice(); LIST.schools = r.list.schools.slice(); LIST.regions = r.list.regions || {}; }
  if (!r || !r.label) {
    ME = null;
    if (r && r.retry) MtryuMeSync.block({ title: '학교를 불러오지 못했어요', text: '내 학교를 순위 서버에 올리는 중에 잠깐 문제가 생겼어요. 잠시 뒤에 다시 해 주세요.', label: '다시 시도', onClick: () => location.reload() });
    else MtryuMeSync.block({ title: '학교를 다시 골라 주세요', text: '순위는 나이스에서 찾은 학교로만 올라가요. 내 정보에서 학교를 검색해서 다시 골라 주세요.', label: '학교 다시 고르기', onClick: () => window.MtryuMe && window.MtryuMe.openDialog({ required: true, strict: true }) });
    return;
  }
  MtryuMeSync.unblock();
  ME = { nick: cleanName(m.nick), uid: m.uid, label: r.label };
}
function enforceMine() {   // 기록할 학교와 이름을 내 것으로 맞춰요 (순위를 보던 학교는 그대로 둬요)
  if (!ME) return;
  S.school = ME.label; S.name = ME.nick; prefs.school = ME.label;
  if (S.vschool && !LIST.schools.includes(S.vschool)) S.vschool = null;
}
async function refreshMe() {
  await syncMe(); enforceMine();
  try { localStorage.setItem('cn_prefs', JSON.stringify(Object.assign(readJSON('cn_prefs'), { school: S.school, name: S.name }))); } catch (e) {}   // 학년도 등 다른 저장값은 그대로 둬요
  if (S.screen === 'home') render();
}
MtryuMeSync.watch(refreshMe);

/* ---------- 시작 ---------- */
(async function init() {
  render();
  await loadList(); await syncMe();
  
  if (!ME && LIST.schools.includes(prefs.school)) S.school = prefs.school;
  fixSelection(); enforceMine();
  if (S.screen === 'home') render();
})();

/* 테스트에서 쓰는 통로 (게임에는 영향 없어요) */
window.__coin = { get G() { return G; }, settleTime, probRange, betRound, seqStats, genFake, randBits, bitsToHex, hexToBits, runPoints, derive, BET, Store, S, B, LIST };
})();
