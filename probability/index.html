<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT RYU의 확률 실험실</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#7719AA">
<meta name="description" content="확률 실험실 — 동전 실험실, 확률 실험 시뮬레이터(내가 만드는 실험), 달랑베르를 이겨라, 강 건너기(롤러 더비), 골드핑거(찍기 전략 실험)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B0F3F;--muted:#5A4670;--line:#E6D8F2;--bg:#F8F2FC;--purple:#7719AA;--pink:#D81B7A;--tint:#F0DDFA}
*{box-sizing:border-box}
body{margin:0;min-height:calc(100vh - var(--labbar-h,0px));background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:40px 16px 56px}
.wrap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:28px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ic{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;background:var(--tint);border:2px solid var(--ink)}
h1{margin:0;font-size:clamp(28px,5vw,38px);line-height:1.25;font-weight:900}
h1 em{font-style:normal;color:var(--purple)}
.hero p{margin:0;font-size:17px;line-height:1.6;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:14px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:14px 18px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--purple);color:var(--ink);text-decoration:none;font-size:18px;font-weight:700;transition:transform .15s,box-shadow .15s}
a.item:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--pink)}
a.item:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.item .t{display:flex;align-items:center;gap:12px;min-width:0}
.tag{flex:none;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--purple)}
.arrow{flex:none;font-size:22px;color:var(--purple)}
.item.off{box-shadow:4px 4px 0 #CFC3DB;color:var(--muted);cursor:not-allowed}
.item.off .tag{background:#FFE9A8;color:var(--ink)}
.item.off .arrow{font-size:14px;font-weight:700;color:var(--muted)}
.note{margin:0;text-align:center;font-size:15px;font-weight:500;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.item{transition:none}}
</style>
<script src="https://mtryu-lab.vercel.app/lab-bar.js" defer></script>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <span class="ic"><svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="#7719AA" stroke-width="3.2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="32" height="32" rx="8"/><circle cx="14" cy="14" r="2.4" fill="#7719AA" stroke="none"/><circle cx="26" cy="14" r="2.4" fill="#7719AA" stroke="none"/><circle cx="20" cy="20" r="2.4" fill="#7719AA" stroke="none"/><circle cx="14" cy="26" r="2.4" fill="#7719AA" stroke="none"/><circle cx="26" cy="26" r="2.4" fill="#7719AA" stroke="none"/></svg></span>
    <h1><em>확률 실험실</em></h1>
    <p>탐구하고 싶은 내용을 선택하세요!</p>
  </div>

  <nav class="menu" aria-label="확률 실험실 메뉴">
    <a class="item" href="/probability/coin/"><span class="t"><span class="tag">동전</span>동전 실험실</span><span class="arrow">➔</span></a>
    <a class="item" href="/probability/sim/"><span class="t"><span class="tag">만들기</span>확률 실험 시뮬레이터</span><span class="arrow">➔</span></a>
    <a class="item" href="/probability/dalembert/"><span class="t"><span class="tag">동전 2개</span>달랑베르를 이겨라</span><span class="arrow">➔</span></a>
    <a class="item" href="/probability/river/"><span class="t"><span class="tag">주사위</span>강 건너기 (롤러 더비)</span><span class="arrow">➔</span></a>
    <a class="item" href="/probability/goldfinger/"><span class="t"><span class="tag">찍기</span>골드핑거 (찍기 전략 실험)</span><span class="arrow">➔</span></a>
  </nav>

  <p class="note">틀려도 괜찮아요! 직접 던져 보며 배우는 여러분의 용기를 응원합니다.</p>
</main>
</body>
</html>
