<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강 건너기 · 확률 실험실</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12163A; --panel:#1D2257; --panel2:#262C6B; --line:#323A8A; --deep:#161B4A;
  --text:#F4F6FF; --muted:#AEB6F0; --yellow:#FFD23F; --green:#5BD97F; --orange:#FF8A2B; --ink:#12163A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0C0F2B;overflow:hidden;color:var(--text);
  font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif}
button,input{font-family:inherit}
button{cursor:pointer}
.jua{font-family:'Jua','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:400}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:860px;flex:none;transform-origin:center center;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;position:relative}

/* 머리글 */
.hdr{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:2px solid #232A70}
.brand{display:flex;align-items:center;gap:14px}
.home{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:#232A70;color:var(--text);font-size:14px;font-weight:700;text-decoration:none;margin-right:6px;white-space:nowrap}
.home:hover{background:var(--line)}
.brand small{display:block;font-size:13px;color:var(--muted)}
.brand b{font-family:'Jua','Noto Sans KR',sans-serif;font-size:26px;font-weight:400;line-height:1.1}
.nav{display:flex;gap:8px;align-items:center}
.pill{font-size:14px;padding:6px 14px;border-radius:999px;background:#232A70;color:var(--muted)}
.pill.on{background:var(--yellow);color:var(--ink);font-weight:700}
.ctx{width:240px;text-align:right;font-size:15px;color:var(--muted)}
#screen{flex:1;min-height:0;display:flex}

/* 공통 버튼 */
.go{display:flex;align-items:center;justify-content:center;border:0;border-radius:16px;background:var(--yellow);color:var(--ink);
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:30px;padding:0 48px;height:60px;text-decoration:none}
.go:disabled{background:var(--line);color:var(--muted);cursor:default;font-family:'Noto Sans KR',sans-serif;font-size:18px;font-weight:500}
.ghost{border:0;border-radius:16px;background:var(--line);color:var(--text);font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;height:56px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:15px;text-decoration:underline;padding:6px}

/* 관리자 모드 */
.admin{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px;padding:32px 120px 28px;overflow-y:auto}
.acard{background:var(--panel);border-radius:20px;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.acard h2{margin:0;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:44px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#232A70;border-radius:999px;padding:8px 8px 8px 18px;font-size:18px}
.chip button{width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--text);font-size:20px;line-height:1}
.addrow{display:flex;gap:12px}
.addrow input,.mbox input{flex:1;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:20px;padding:0 16px;font-family:inherit}
.ghost.sm{height:52px;font-size:20px;padding:0 28px}
.go.sm{height:52px;font-size:22px;padding:0 32px}
.afoot{display:flex;align-items:center;justify-content:space-between;gap:24px}
.amsg{font-size:16px;color:var(--muted)}
.amsg.err{color:#FF8A8A}
.arow{display:flex;gap:12px}
.arow .ghost{padding:0 32px}
.acard.danger{border:2px solid #7A2B4A}
.addrow select{flex:1;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;padding:0 12px;font-family:inherit}
.dangerbtn{background:#B3265E;color:#fff;white-space:nowrap}
.sugg{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;flex:none}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:16px;border:0;border-radius:12px;background:#232A70;color:var(--text);padding:12px 18px;font-size:18px;text-align:left}
.sitem b{font-weight:700}.sitem span{color:var(--muted);font-size:15px}
.snote{color:var(--muted);font-size:15px;padding:4px 2px}
.modal{position:absolute;inset:0;background:rgba(10,12,40,.82);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{width:460px;background:var(--panel);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px}
.mbox h2{margin:0;font-size:34px}
.mbox p{margin:0;color:var(--muted);font-size:17px}
.mbox .amsg{min-height:22px}
.mbox .arow{justify-content:flex-end}

/* 1. 서버 선택 */
.setup{flex:1;min-height:0;display:flex;flex-direction:column;gap:24px;padding:32px 64px 28px}
.hero{display:flex;align-items:center;justify-content:space-between}
.hero h1{margin:0;font-size:80px;line-height:1}
.hero p{margin:12px 0 0;font-size:20px;color:var(--muted)}
.hero-ic{display:flex;gap:24px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:16px;padding:16px 20px}
.step i{width:40px;height:40px;flex:none;border-radius:50%;background:var(--yellow);color:var(--ink);font-style:normal;
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:22px;display:flex;align-items:center;justify-content:center}
.step b{display:block;font-size:18px}
.step span{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.pick{flex:1;min-height:0;display:flex;gap:24px}
.years{width:280px;flex:none;background:var(--panel);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.years .ybtn{flex:none}
.years h2,.schools h2{margin:0;font-size:18px;font-weight:500;color:var(--muted)}
.ybtn{height:56px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--text);
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;text-align:left;padding:0 20px}
.ybtn.on{border:3px solid var(--yellow);background:var(--panel2)}
.schools{flex:1;min-width:0;background:var(--panel);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:16px}
.shead input{width:280px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:17px;padding:0 14px;font-family:inherit}
.snone{grid-column:1/-1;color:var(--muted);font-size:17px;padding:16px 4px}
.shead span{font-size:14px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;flex:1;min-height:0;grid-auto-rows:150px;overflow-y:auto;padding:3px}
.scard{position:relative;border-radius:16px;border:2px solid var(--line);background:transparent;color:var(--text);padding:20px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.scard.on{border:3px solid var(--yellow);background:var(--panel2)}
.scard .nm{font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.scard small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.scard .ck{position:absolute;right:14px;top:14px}
.enter{flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-radius:20px;padding:16px 24px 16px 32px}
.enter small{font-size:14px;color:var(--muted)}
.enter .jua{font-size:30px;line-height:1.2}

/* 2·3. 우물 */
.field{flex:1;min-height:0;display:flex;gap:16px;padding:24px}
.well{flex:none;width:560px;background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:13px 16px 16px;display:flex;flex-direction:column;gap:8px}
.well.a{border-color:var(--green)} .well.b{border-color:var(--orange)}
.whead{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.tag{flex:none;font-family:'Jua','Noto Sans KR',sans-serif;font-size:18px;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--text)}
.name-in{width:180px;height:44px;border-radius:12px;border:2px solid #4A54B0;background:var(--deep);color:var(--text);
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;padding:0 12px}
.name-in:focus{outline:3px solid var(--yellow);outline-offset:1px}
.name-big{margin:0;font-size:30px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.cnt{font-size:18px;white-space:nowrap}
.cnt b{font-family:'Jua','Noto Sans KR',sans-serif;font-size:34px;font-weight:400}
.well.a .cnt b{color:var(--green)} .well.b .cnt b{color:var(--orange)}
.grid{display:flex;background:var(--deep);border-radius:14px;overflow:hidden}
.col{width:44px;display:flex;flex-direction:column;border-left:1px solid #232A70}
.cell{height:40px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--panel);position:relative}
.num{height:32px;display:flex;align-items:center;justify-content:center;background:#232A70;font-family:'Jua','Noto Sans KR',sans-serif;font-size:20px}
.col.rolled{background:rgba(255,210,63,.14)}
.col.rolled .num{background:var(--yellow);color:var(--ink)}
.arrows{display:flex}
.arr{width:44px;display:flex;flex-direction:column;align-items:center;gap:6px}
.arr button{width:42px;height:44px;border:0;border-radius:10px;display:flex;align-items:center;justify-content:center}
.arr .up{background:#3A44A8} .arr .dn{background:#2A3180}
.arr button:disabled{opacity:.35;cursor:default}
.winfo{height:94px;display:flex;align-items:center;gap:18px;padding:0 8px;font-size:15px;color:var(--muted)}
.winfo .lg{display:flex;align-items:center;gap:8px}
.winfo .msg{margin-left:auto;color:var(--text);font-size:16px;text-align:right}

.tok{width:32px;height:32px;display:flex;align-items:center;justify-content:center;position:relative}
.tok.hit{animation:shake .28s linear infinite;filter:drop-shadow(0 0 7px #FFD23F)}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-3px) rotate(-9deg)}40%{transform:translateX(3px) rotate(9deg)}60%{transform:translateX(-3px) rotate(-6deg)}80%{transform:translateX(3px) rotate(6deg)}}
.shard{transform-box:fill-box;transform-origin:center;animation:fall .6s cubic-bezier(.2,.7,.3,1) both}
@keyframes fall{from{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.7);opacity:.1}to{transform:none;opacity:1}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--yellow);animation:spark .55s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1.2);opacity:1}to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

/* 강 패널 */
.river{flex:1;min-width:0;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#1A5FB4,#14489A);display:flex;flex-direction:column;gap:14px;padding:20px}
.river>svg.waves{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.card{position:relative;background:rgba(18,22,58,.88);border-radius:16px;padding:16px 18px}
.card small{display:block;font-size:13px;color:var(--muted)}
.card h1{margin:2px 0 6px;font-size:26px;line-height:1.2}
.card p{margin:0;font-size:15px;line-height:1.5;color:#E3E7FF}
.prog{margin-bottom:12px}
.prog:last-child{margin-bottom:0}
.prog .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;gap:8px}
.prog .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>div{height:12px;border-radius:6px;transition:width .2s}
.speed label{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:8px}
.speed label b{font-family:'Jua','Noto Sans KR',sans-serif;font-size:20px;font-weight:400;color:var(--yellow)}
.speed input{width:100%;margin:0;accent-color:var(--yellow)}
.speed .tick{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.spacer{flex:1}
.river .go{position:relative;height:68px;font-size:32px;padding:0}
.river .go:disabled{font-size:18px}

/* 주사위 */
.rollhead{display:flex;justify-content:space-between;align-items:baseline}
.rollhead h1{margin:0;font-size:26px}
.rollhead span{font-size:14px;color:var(--muted)}
.dice{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:40px;margin:14px 0 6px;height:124px}
.dw{position:relative;width:96px;height:96px;perspective:640px}
.dsh{position:absolute;left:10px;right:10px;bottom:-8px;height:16px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px);opacity:.5}
.tilt{width:96px;height:96px;transform-style:preserve-3d}
.tilt.t1{transform:rotateX(-16deg) rotateY(14deg) rotateZ(-5deg)}
.tilt.t2{transform:rotateX(-16deg) rotateY(-14deg) rotateZ(6deg)}
.cube{position:relative;width:96px;height:96px;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:14px;background:#F4F6FF;box-shadow:inset 0 0 0 3px #D5DAF3,inset 0 -8px 14px rgba(18,22,58,.12);backface-visibility:hidden}
.face svg{display:block}
.eq{text-align:center;font-size:18px;color:#E3E7FF;height:26px}
.total{text-align:center;font-family:'Jua','Noto Sans KR',sans-serif;font-size:68px;line-height:1.05;color:var(--yellow);height:72px}
.say{text-align:center;font-size:15px;color:#E3E7FF;margin-top:6px;min-height:22px}
.hist{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start;height:78px;overflow-y:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:#6B76D6 transparent}
.hist::-webkit-scrollbar{width:8px}.hist::-webkit-scrollbar-thumb{background:#6B76D6;border-radius:4px}.hist::-webkit-scrollbar-track{background:transparent}
.hist i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:18px;background:var(--line);color:var(--text)}
.hist i.last{background:var(--yellow);color:var(--ink)}
.cardlbl{font-size:14px;color:var(--muted);margin-bottom:10px}
.row2{display:flex;gap:10px;position:relative}
.row2 .ghost{flex:1}

/* 4. 결과 */
.result{flex:1;min-height:0;display:flex;gap:24px;padding:24px 32px}
.win{flex:none;width:600px;background:var(--panel);border:3px solid var(--green);border-radius:24px;padding:24px 32px;display:flex;flex-direction:column;align-items:center;gap:12px}
.win.tie{border-color:var(--yellow)}
.win.o{border-color:var(--orange)}
.win.none{border-color:var(--line)}
.win>*{flex-shrink:0}
.win h1{margin:0;font-size:52px;line-height:1.2;text-align:center;max-width:520px;overflow-wrap:anywhere}
.win .big{font-family:'Jua','Noto Sans KR',sans-serif;font-size:32px;color:var(--yellow)}
.win p{margin:0;font-size:20px;color:#E3E7FF;text-align:center;line-height:1.5}
.saved{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;background:#1E4D3A;font-size:17px;margin-top:4px}
.saved.warn{background:#5A3F12}
.saved.err{background:#4A2A3A}
.minilbl{width:100%;font-size:15px;color:var(--muted)}
.mini{display:flex;background:var(--deep);border-radius:12px;overflow:hidden;align-self:center}
.mini .mc{width:40px;display:flex;flex-direction:column;border-left:1px solid #232A70}
.mini .mc>*{flex-shrink:0}
.mini .mcell{display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--panel)}
.mini .mnum{height:26px;display:flex;align-items:center;justify-content:center;background:#232A70;font-family:'Jua','Noto Sans KR',sans-serif;font-size:15px}
.board{flex:1;min-width:0;background:var(--panel);border-radius:24px;padding:24px 28px;display:flex;flex-direction:column;gap:12px}
.bhead{display:flex;align-items:center;justify-content:space-between}
.bhead small{display:block;font-size:14px;color:var(--muted)}
.bhead h2{margin:0;font-size:36px;line-height:1.15}
.mode{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--line);color:#E3E7FF}
.mode.local{background:#5A3F12}
.cols,.rowx{display:grid;grid-template-columns:72px minmax(0,1fr) 150px 220px;align-items:center;padding:0 16px}
.cols{font-size:14px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:5px}
.cnt{font-size:20px;color:var(--muted);margin-left:8px}
.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.findrow{display:flex;gap:8px}
.findrow input{width:200px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;padding:0 12px;font-family:inherit}
.pbtn{height:40px;min-width:40px;border:0;border-radius:10px;background:var(--line);color:var(--text);font-size:20px;font-family:inherit}
.pbtn.wide{font-size:16px;padding:0 18px}.pbtn:disabled{opacity:.35}
.mybtn{height:40px;border:2px solid var(--green);border-radius:10px;background:transparent;color:var(--text);font-size:15px;padding:0 14px;font-family:inherit}
.mybtn.o{border-color:var(--orange)}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:auto;padding-top:4px;color:var(--muted);font-size:16px}
.pnum{min-width:200px;text-align:center}
.rowx{height:44px;border-radius:12px;background:#232A70;border:2px solid transparent}
.rowx.me{background:#1E4D3A;border-color:var(--green)}
.rowx.me.o{background:#5A3A1C;border-color:var(--orange)}
.rowx .rk{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Jua','Noto Sans KR',sans-serif;font-size:19px;background:var(--line)}
.rowx .nm{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:500;min-width:0}
.rowx .nm span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowx .nm em{font-style:normal;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--green);color:var(--ink);font-weight:700;flex:none}
.rowx.o .nm em{background:var(--orange)}
.rowx .tn{font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px}
.rowx .bars{display:flex;align-items:flex-end;gap:3px;height:32px}
.rowx .bars span{display:block;width:12px;border-radius:2px}
.gap{text-align:center;color:var(--muted);font-size:18px;line-height:14px;height:14px}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:18px}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <header class="hdr">
      <div class="brand">
        <a class="home" id="homeLink" href="/" title="MT RYU의 실험실 첫 화면으로"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 9 L9 2.5 L16 9 M4 8 V15 H14 V8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>실험실 홈</a>
        <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="2" y="2" width="32" height="32" rx="9" fill="#FFD23F"/><circle cx="11" cy="11" r="3" fill="#12163A"/><circle cx="18" cy="18" r="3" fill="#12163A"/><circle cx="25" cy="25" r="3" fill="#12163A"/></svg>
        <div><small>확률 실험실</small><b>강 건너기</b></div>
      </div>
      <nav class="nav" id="nav" aria-label="진행 단계"></nav>
      <div class="ctx" id="ctx"></div>
    </header>
    <div id="screen"></div>
  </div>
</div>

<script>
/* =====================================================================
   선생님 설정  ← 여기만 고치면 돼요
   ===================================================================== */
const CONFIG = {

/* 간단한 해시 (서버가 없을 때 이 컴퓨터용 관리자 암호 확인에만 써요) */
function hash53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

const el = id => document.getElementById(id);

function startGame() {
  const st = { a: state.a.counts.map(c => new Array(c).fill(1)), b: state.b.counts.map(c => new Array(c).fill(1)) };
  G = { id: Date.now() + Math.random(), paused: false, rolls: 0, st, left: { a: 12, b: 12 }, hist: [] };
  runGame(G.id);
}
const alive = () => !!G;
async function gate(id) { while (G && G.id === id && G.paused) await sleep(80); return !!G && G.id === id; }
async function wait(id, ms) { await sleep(ms); return gate(id); }

async function runGame(id) {
  if (!(await wait(id, 600))) return;
  while (G && G.id === id) {
    const sp = SPEEDS[state.speed];
    G.rolls++;
    el('rollNo').textContent = G.rolls + '번째 굴림';
    el('rollSt').textContent = '주사위 굴리는 중';
    el('eq').innerHTML = '&nbsp;'; el('total').textContent = '…'; el('say').innerHTML = '&nbsp;';
    document.querySelectorAll('.col.rolled').forEach(c => c.classList.remove('rolled'));
    ['a', 'b'].forEach(p => { el('info-' + p).innerHTML = '&nbsp;'; });

    /* 주사위 굴리기: 위에서 던져 튕기고 굴러서 멈춰요 */
    const x = rand6(), y = rand6(), s = x + y;
    await Promise.all([throwDie(1, x, sp.roll), throwDie(2, y, sp.roll)]);
    if (!G || G.id !== id) return;
    if (!(await gate(id))) return;
    el('eq').textContent = x + ' + ' + y + ' =';
    el('total').textContent = s;
    el('rollSt').innerHTML = '&nbsp;';
    document.querySelectorAll('.col[id$="-' + s + '"]').forEach(c => c.classList.add('rolled'));

    /* 맨 위 토큰 찾기 */
    const hits = [];
    ['a', 'b'].forEach(p => {
      const arr = G.st[p][s - 1];
      let k = arr.lastIndexOf(1);
      if (k >= 0) hits.push({ p, i: s - 1, k });
    });
    hits.forEach(h => el('t-' + h.p + '-' + h.i + '-' + h.k).classList.add('hit'));
    el('say').textContent = hits.length ? s + '번 칸의 맨 위 토큰이 부서져요' : s + '번 칸에는 부술 토큰이 없어요';
    if (!(await wait(id, sp.hit))) return;

    /* 부수기 */
    hits.forEach(h => {
      G.st[h.p][h.i][h.k] = 0; G.left[h.p]--;
      const t = el('t-' + h.p + '-' + h.i + '-' + h.k);
      t.classList.remove('hit');
      let parts = '';
      for (let n = 0; n < 7; n++) { const ang = n / 7 * Math.PI * 2; parts += `<i style="--x:${Math.round(Math.cos(ang) * 22)}px;--y:${Math.round(Math.sin(ang) * 22)}px"></i>`; }
      t.innerHTML = brokenSvg(h.p, 32) + `<span class="burst">${parts}</span>`;
      el('left-' + h.p).textContent = G.left[h.p];
    });
    ['a', 'b'].forEach(p => {
      const broke = hits.some(h => h.p === p);
      el('info-' + p).textContent = broke ? s + '번 칸 토큰이 부서졌어요' : s + '번 칸엔 토큰이 없어요';
    });
    G.hist.push(s);
    const hb = el('hist');
    hb.innerHTML = G.hist.map((v, i, arr) => `<i${i === arr.length - 1 ? ' class="last"' : ''}>${v}</i>`).join('');
    hb.scrollTop = hb.scrollHeight; el('histN').textContent = '· ' + G.hist.length + '번';

    /* 끝났는지 */
    const done = ['a', 'b'].filter(p => G.left[p] === 0);
    if (done.length) { await wait(id, 700); if (G && G.id === id) finish(done); return; }
    const reach = p => G.left[p] - G.st[p][0].filter(v => v === 1).length;   // 1번 칸 토큰은 부술 수 없어요
    if (reach('a') === 0 && reach('b') === 0) { await wait(id, 900); if (G && G.id === id) finish([], true); return; }

    if (!(await wait(id, sp.gap))) return;
  }
}

/* ---------- 4. 결과 ---------- */
async function finish(winners, stalemate) {
  const rolls = G.rolls;
  G = null;
  state.result = { winners, rolls, stalemate: !!stalemate, saved: null, rank: {}, ids: {}, top: [], total: 0, offset: 0, matches: null, q: '', status: winners.length ? 'saving' : 'none' };
  show('result');
  paintResult();
  if (!winners.length) { loadBoardOnly(); return; }
  let last = null;
  for (const p of winners) {
    const rec = { id: rid(), name: cleanName(state[p].name), rolls, setup: state[p].counts.slice(), ts: Date.now() };
    state.result.ids[p] = rec.id;
    last = await Store.save(state.year, state.school, rec);
    state.result.rank[p] = last.rank;
  }
  state.result.top = last.top; state.result.total = last.total; state.result.offset = 0; state.result.status = Store.mode === 'server' ? 'ok' : 'local';
  paintResult();
}
async function loadBoardOnly() {
  const pg = await Store.page(state.year, state.school, 0, CONFIG.pageSize);
  state.result.top = pg.rows; state.result.total = pg.total; state.result.offset = 0;
  state.result.status = Store.mode === 'server' ? 'none' : 'nonelocal';
  paintResult();
}
function miniWell(p, counts, budget) {
  const rows = Math.max(3, Math.max.apply(null, counts));
  const h = Math.max(10, Math.min(28, Math.floor(budget / rows)));
  const ic = Math.max(8, h - 5);
  const cols = counts.map((c, i) => {
    let cells = '';
    for (let r = 0; r < rows; r++) cells += `<div class="mcell" style="height:${h}px">${(rows - 1 - r) < c ? icon(p, ic) : ''}</div>`;
    return `<div class="mc"><div>${cells}</div><div class="mnum">${i + 1}</div></div>`;
  }).join('');
  return `<div class="mini" role="img" aria-label="처음 배치">${cols}</div>`;
}
function resultHTML() {
  const R = state.result;
  return `<main class="result"><section class="win" id="winCard"></section><section class="board" id="board"></section></main>`;
}
function paintResult() {
  if (state.screen !== 'result') return;
  const R = state.result, w = R.winners;
  const card = el('winCard'), board = el('board'); if (!card || !board) return;
  let cls = '', title = '', sub = '', trophy = '';
  const cup = col => `<svg width="104" height="104" viewBox="0 0 120 120" aria-hidden="true"><path d="M34 20 H86 V46 C86 66 74 78 60 78 C46 78 34 66 34 46 Z" fill="#FFD23F"/><path d="M34 28 H18 C18 46 26 54 38 56" fill="none" stroke="#FFD23F" stroke-width="6" stroke-linecap="round"/><path d="M86 28 H102 C102 46 94 54 82 56" fill="none" stroke="#FFD23F" stroke-width="6" stroke-linecap="round"/><rect x="54" y="78" width="12" height="16" fill="#FFD23F"/><rect x="38" y="94" width="44" height="10" rx="4" fill="#FFD23F"/>${col}</svg>`;
  if (w.length === 1) {
    const p = w[0]; cls = p === 'b' ? 'o' : '';
    trophy = cup(p === 'a' ? `<svg x="44" y="26" width="32" height="32" viewBox="0 0 32 32">${CUC}</svg>` : '<path d="M52 36 Q60 29 68 36 L60 56 Z" fill="#FF8A2B"/><path d="M60 34 C58 31 58 29 59.4 27.6 C60.4 29.2 60.4 31.4 60 34Z" fill="#3DDC84"/>');
    title = esc(cleanName(state[p].name)) + ' 승리!';
    sub = `${p === 'a' ? '1P' : '2P'} · 주사위를 <span class="big">${R.rolls}</span>번 굴려서 토큰을 모두 부쉈어요`;
  } else if (w.length === 2) {
    cls = 'tie'; trophy = cup('');
    title = '무승부!';
    sub = `${esc(cleanName(state.a.name))}, ${esc(cleanName(state.b.name))} 두 사람이 같은 <span class="big">${R.rolls}</span>번째 굴림에 모두 부쉈어요`;
  } else {
    cls = 'none'; trophy = `<svg width="104" height="104" viewBox="0 0 104 104" aria-hidden="true"><circle cx="52" cy="52" r="44" fill="none" stroke="#AEB6F0" stroke-width="6"/><path d="M52 28 V56 M52 68 V72" stroke="#AEB6F0" stroke-width="8" stroke-linecap="round"/></svg>`;
    title = '아무도 끝낼 수 없어요';
    sub = '두 사람 모두 <b>1번 칸</b>에 토큰이 남아 있어요.<br>주사위 두 개의 합은 2부터 나와서 1번 칸은 부술 수 없어요!';
  }
  let note = '';
  if (R.status === 'saving') note = '<div class="saved warn"><span>순위표에 기록하는 중…</span></div>';
  else if (R.status === 'ok') note = `<div class="saved"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="flex:none"><circle cx="14" cy="14" r="14" fill="#5BD97F"/><path d="M8 14 L12.5 18.5 L20 10" fill="none" stroke="#12163A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>순위표에 자동으로 기록됐어요${w.length ? ' (' + w.map(p => (R.rank[p] || '?') + '위').join(', ') + ')' : ''}</span></div>`;
  else if (R.status === 'local') note = `<div class="saved warn"><span>이 컴퓨터에만 기록됐어요${w.length ? ' · ' + w.map(p => (R.rank[p] || '?') + '위').join(', ') : ''}</span></div>`;
  else if (R.status === 'none') note = '<div class="saved err"><span>이번 게임은 기록되지 않아요</span></div>';
  else note = '<div class="saved err"><span>이번 게임은 기록되지 않아요 (이 컴퓨터 순위표를 보여줘요)</span></div>';

  const setups = (w.length ? w : []).map(p => `<div class="minilbl">${w.length === 2 ? esc(cleanName(state[p].name)) + ' 처음 배치' : '처음 배치 (함께 기록돼요)'}</div>${miniWell(p, state[p].counts, w.length === 2 ? 60 : 112)}`).join('');
  card.className = 'win ' + cls;
  card.innerHTML = `${trophy}<h1 class="jua">${title}</h1><p>${sub}</p>${note}${setups}<div class="spacer"></div>
    <button type="button" class="go" style="width:100%;height:64px;font-size:28px" data-act="again">다시 하기</button>
    <button type="button" class="linkbtn" data-act="tosetup">학교 선택으로 돌아가기</button>`;

  /* 순위표 */
  const meIds = Object.keys(R.ids).map(p => ({ p, id: R.ids[p] }));
  const idToP = {}; meIds.forEach(m => { idToP[m.id] = m.p; });
  const medal = ['#FFD23F', '#D9DEF5', '#E59A5B'];
  const rowHtml = (r, rank) => {
    const p = idToP[r.id]; const me = !!p;
    const bars = (r.setup || []).map(c => `<span style="height:${c === 0 ? 3 : Math.min(c, 6) * 5}px;background:${c === 0 ? '#4A54B0' : (me ? COLOR[p] : '#AEB6F0')}"></span>`).join('');
    const bg = rank <= 3 ? medal[rank - 1] : null;
    return `<div class="rowx${me ? ' me' : ''}${p === 'b' ? ' o' : ''}"><span><span class="rk" style="${bg ? `background:${bg};color:#12163A` : ''}">${rank}</span></span>
      <span class="nm"><span class="t">${esc(r.name)}</span>${me ? '<em>방금 기록</em>' : ''}</span><span class="tn">${r.rolls}번</span><span class="bars">${bars}</span></div>`;
  };
  const PS = CONFIG.pageSize, total = R.total || 0, offset = R.offset || 0;
  const pages = Math.max(1, Math.ceil(total / PS)), cur = Math.floor(offset / PS) + 1;
  let rows;
  if (R.matches) {
    rows = R.matches.length ? R.matches.map(r => rowHtml(r, r.rank)).join('') : '<div class="empty">그 이름의 기록이 없어요.</div>';
  } else {
    const top = R.top || [];
    rows = top.length ? top.map((r, i) => rowHtml(r, offset + i + 1)).join('') : '<div class="empty">아직 기록이 없어요. 첫 번째 기록을 남겨 보세요!</div>';
  }
  const mine = w.filter(p => R.rank[p]).map(p => `<button type="button" class="mybtn${p === 'b' ? ' o' : ''}" data-act="gomine" data-p="${p}">${esc(cleanName(state[p].name))} ${R.rank[p]}위 보기</button>`).join('');
  const pager = R.matches
    ? `<div class="pager"><span>이름 검색 결과 ${R.matches.length}명${R.matches.length >= 50 ? ' (최대 50명)' : ''}</span><button type="button" class="pbtn wide" data-act="clearfind">전체 순위로</button></div>`
    : `<div class="pager"><button type="button" class="pbtn" data-act="pg" data-v="first" aria-label="처음 쪽"${cur <= 1 ? ' disabled' : ''}>«</button><button type="button" class="pbtn" data-act="pg" data-v="prev" aria-label="이전 쪽"${cur <= 1 ? ' disabled' : ''}>‹</button><span class="pnum">${cur} / ${pages}쪽 · ${total ? (offset + 1) + '~' + Math.min(offset + PS, total) + '위' : '기록 없음'}</span><button type="button" class="pbtn" data-act="pg" data-v="next" aria-label="다음 쪽"${cur >= pages ? ' disabled' : ''}>›</button><button type="button" class="pbtn" data-act="pg" data-v="last" aria-label="마지막 쪽"${cur >= pages ? ' disabled' : ''}>»</button></div>`;
  board.innerHTML = `<div class="bhead"><div><small>${state.year}학년도 · ${esc(state.school)}</small><h2 class="jua">전체 순위 <span class="cnt">${total}명</span></h2></div>
      <span class="mode${Store.mode === 'local' ? ' local' : ''}">${Store.mode === 'local' ? '이 컴퓨터 기록' : '학교 전체 기록'}</span></div>
    <div class="strip"><form class="findrow" data-form="find" autocomplete="off"><input id="findQ" type="text" maxlength="8" placeholder="내 이름 찾기" value="${esc(R.q || '')}"><button type="submit" class="pbtn wide">찾기</button></form>${mine}</div>
    <div class="cols"><span>순위</span><span>이름</span><span>굴린 횟수</span><span>처음 배치 (1 → 12)</span></div>
    <div class="rows">${rows}</div>${pager}`;
}
async function loadPage(offset) {
  const R = state.result; R.matches = null;
  const pg = await Store.page(state.year, state.school, offset, CONFIG.pageSize);
  if (state.screen !== 'result') return;
  R.top = pg.rows; R.total = pg.total; R.offset = offset; paintResult();
}
async function runFind(q) {
  const R = state.result; R.q = q;
  if (!q) { R.matches = null; return paintResult(); }
  const m = await Store.find(state.year, state.school, q);
  if (state.screen !== 'result') return;
  R.matches = m; paintResult();
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const hl = e.target.closest('#homeLink');
  if (hl && state.screen === 'play' && !confirm('게임을 그만하고 실험실 첫 화면으로 갈까요?')) { e.preventDefault(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'year') { state.year = Number(b.dataset.v); savePrefs(); show('setup'); }
  else if (act === 'school') { state.school = b.dataset.v; savePrefs(); show('setup'); }
  else if (act === 'enter') { show('place'); }
  else if (act === 'inc' || act === 'dec') {
    const P = state[b.dataset.p], i = Number(b.dataset.i), d = act === 'inc' ? 1 : -1;
    if (d > 0 && sum(P.counts) >= 12) return;
    if (P.counts[i] + d < 0) return;
    P.counts[i] += d;
    const keep = [$('[data-name="a"]').value, $('[data-name="b"]').value];
    state.a.name = keep[0]; state.b.name = keep[1];
    $('#screen').innerHTML = placeHTML(); updateReady();
  }
  else if (act === 'start') {
    state.a.name = cleanName($('[data-name="a"]').value); state.b.name = cleanName($('[data-name="b"]').value);
    savePrefs(); show('play');
  }
  else if (act === 'pause') { if (!G) return; G.paused = !G.paused; b.textContent = G.paused ? '계속하기' : '일시정지'; }
  else if (act === 'quit') {
    if (b.dataset.sure) { show('place'); return; }
    b.dataset.sure = '1'; b.textContent = '정말 그만할까요?';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = '그만하기'; } }, 3000);
  }
  else if (act === 'again') { state.a.counts = new Array(12).fill(0); state.b.counts = new Array(12).fill(0); show('place'); }
  else if (act === 'tosetup') { show('setup'); }
  else if (act === 'pg') {
    const R = state.result, PS = CONFIG.pageSize, last = Math.max(0, Math.ceil(R.total / PS) - 1) * PS, v = b.dataset.v;
    const to = v === 'first' ? 0 : v === 'last' ? last : v === 'prev' ? R.offset - PS : R.offset + PS;
    loadPage(Math.min(Math.max(to, 0), last));
  }
  else if (act === 'gomine') { const rk = state.result.rank[b.dataset.p]; if (rk) loadPage(Math.floor((rk - 1) / CONFIG.pageSize) * CONFIG.pageSize); }
  else if (act === 'clearfind') { state.result.q = ''; loadPage(state.result.offset || 0); }
  else if (act === 'admin') { openLogin(); }
  else if (act === 'loginx') { closeLogin(); }
  else if (act === 'admcancel') { ADM.key = null; show('setup'); }
  else if (act === 'admsave') { adminSave(); }
  else if (act === 'admdelall') {
    if (b.dataset.sure) { deleteAllRecords(); return; }
    b.dataset.sure = '1'; b.textContent = '정말 모두 삭제할까요?';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = '전체 순위 삭제'; } }, 4000);
  }
  else if (act === 'sadd') { addSchoolPublic(Number(b.dataset.i)); }
  else if (act === 'admpick') { pickSchool(Number(b.dataset.i)); }
  else if (act === 'admdel') {
    if (b.dataset.k === 'y') ADM.years = ADM.years.filter(y => String(y) !== b.dataset.v);
    else { ADM.schools = ADM.schools.filter(x => x !== b.dataset.v); delete ADM.regions[b.dataset.v]; }
    ADM.msg = ''; ADM.err = false; show('admin');
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form;
  if (k === 'find') runFind(document.getElementById('findQ').value.trim());
  else if (k === 'login') tryLogin(document.getElementById('admPw').value);
  else adminAdd(k);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.name) { state[t.dataset.name].name = t.value; updateReady(); savePrefs(); }
  if (t.id === 'schoolQ') { SQ.q = t.value; el('sgrid').innerHTML = schoolCards(); searchPublic(t.value); }
  if (t.id === 'admSchool') searchSchools(t.value);
  if (t.id === 'delYear') { ADM.delYear = Number(t.value); ADM.msg = ''; show('admin'); }
  if (t.id === 'delSchool') { ADM.delSchool = t.value; ADM.msg = ''; show('admin'); }
  if (t.id === 'speed') { state.speed = Number(t.value); el('speedLbl').textContent = SPEEDS[state.speed].label; savePrefs(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.name) { const s = $('#start'); if (s && !s.disabled) s.click(); }
});

/* ---------- 화면 크기에 맞추기 ---------- */
function fit() {
  const s = Math.min(window.innerWidth / 1600, window.innerHeight / 860);
  $('#stage').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

/* 개발·점검용 (학생 화면에는 영향 없음) */
window.__rd = { state, get game() { return G; }, SPEEDS, Store, throwDie };

show('setup');
loadList().then(() => { fixSelection(true); if (state.screen === 'setup') show('setup'); });
})();
</script>
