<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강 건너기 · 확률 실험실</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12163A; --panel:#1D2257; --panel2:#262C6B; --line:#323A8A; --deep:#161B4A;
  --text:#F4F6FF; --muted:#C6CCF8; --yellow:#FFD23F; --green:#5BD97F; --orange:#FF8A2B; --ink:#12163A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0C0F2B;overflow:hidden;color:var(--text);
  font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif}
button,input{font-family:inherit}
button{cursor:pointer}
.jua{font-family:'Jua','Noto Sans KR','Malgun Gothic',sans-serif;font-weight:400}
#viewport{position:fixed;inset:var(--labbar-h,0px) 0 0 0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:860px;flex:none;transform-origin:center center;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;position:relative}

/* 머리글 */
.hdr{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:2px solid #232A70}
.brand{display:flex;align-items:center;gap:14px}
.brand small{display:block;font-size:17px;color:var(--muted)}
.brand b{font-family:'Jua','Noto Sans KR',sans-serif;font-size:26px;font-weight:400;line-height:1.1}
.nav{display:flex;gap:8px;align-items:center}
.pill{font-size:18px;padding:6px 14px;border-radius:999px;background:#232A70;color:var(--muted)}
.pill.on{background:var(--yellow);color:var(--ink);font-weight:700}
.ctx{width:240px;text-align:right;font-size:19px;color:var(--muted)}
#screen{flex:1;min-height:0;display:flex}

/* 공통 버튼 */
.go{display:flex;align-items:center;justify-content:center;border:0;border-radius:16px;background:var(--yellow);color:var(--ink);
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:30px;padding:0 48px;height:60px;text-decoration:none}
.go:disabled{background:var(--line);color:var(--muted);cursor:default;font-family:'Noto Sans KR',sans-serif;font-size:18px;font-weight:500}
.ghost{border:0;border-radius:16px;background:var(--line);color:var(--text);font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;height:56px}
.exitbtn{position:relative;flex:none;height:36px;margin-bottom:2px;border:0;border-radius:10px;background:rgba(0,0,0,.22);color:#E3E7FF;font-size:19px;font-weight:500}
.exitbtn:hover{background:rgba(0,0,0,.34)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:19px;text-decoration:underline;padding:6px}

/* 관리자 모드 */
.admin{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px;padding:32px 120px 28px;overflow-y:auto}
.acard{background:var(--panel);border-radius:20px;padding:24px 28px;display:flex;flex-direction:column;gap:16px}
.acard h2{margin:0;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:44px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#232A70;border-radius:999px;padding:8px 8px 8px 18px;font-size:18px}
.chip button{width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--text);font-size:20px;line-height:1}
.addrow{display:flex;gap:12px}
.addrow input,.mbox input{flex:1;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:20px;padding:0 16px;font-family:inherit}
.ghost.sm{height:52px;font-size:20px;padding:0 28px}
.go.sm{height:52px;font-size:22px;padding:0 32px}
.afoot{display:flex;align-items:center;justify-content:space-between;gap:24px}
.amsg{font-size:20px;color:var(--muted)}
.amsg.err{color:#FF8A8A}
.arow{display:flex;gap:12px}
.arow .ghost{padding:0 32px}
.recbox{display:flex;flex-direction:column;gap:10px}
.rectool{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.reclist{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto;padding-right:4px}
.recrow{display:grid;grid-template-columns:28px 52px minmax(0,1fr) 80px 110px;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:10px;background:#232A70;font-size:20px;cursor:pointer}
.recrow.on{background:#5A1F46;outline:2px solid #B3265E}
.recrow input{width:18px;height:18px;accent-color:#FF6B8B}
.rrk{color:var(--muted)}.rnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.rts{color:var(--muted);font-size:17px;text-align:right}
.recfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:19px}.recfoot .err{color:#FF8A8A}
.acard.danger{border:2px solid #7A2B4A}
.addrow select{flex:1;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;padding:0 12px;font-family:inherit}
.dangerbtn{background:#B3265E;color:#fff;white-space:nowrap}
.sugg{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;flex:none}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:16px;border:0;border-radius:12px;background:#232A70;color:var(--text);padding:12px 18px;font-size:18px;text-align:left}
.sitem b{font-weight:700}.sitem span{color:var(--muted);font-size:19px}
.snote{color:var(--muted);font-size:19px;padding:4px 2px}
.modal{position:absolute;inset:0;background:rgba(10,12,40,.82);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{width:460px;background:var(--panel);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px}
.mbox h2{margin:0;font-size:34px}
.mbox p{margin:0;color:var(--muted);font-size:21px}
.mbox .amsg{min-height:22px}
.mbox .arow{justify-content:flex-end}

/* 1. 서버 선택 */
.setup{flex:1;min-height:0;display:flex;flex-direction:column;gap:24px;padding:32px 64px 28px}
.hero{display:flex;align-items:center;justify-content:space-between}
.hero h1{margin:0;font-size:80px;line-height:1}
.hero p{margin:12px 0 0;font-size:20px;color:var(--muted)}
.hero-ic{display:flex;gap:24px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:16px;padding:16px 20px}
.step i{width:40px;height:40px;flex:none;border-radius:50%;background:var(--yellow);color:var(--ink);font-style:normal;
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:22px;display:flex;align-items:center;justify-content:center}
.step b{display:block;font-size:18px}
.step span{display:block;font-size:19px;color:var(--muted);margin-top:2px}
.pick{flex:1;min-height:0;display:flex;gap:24px}
.years{width:280px;flex:none;background:var(--panel);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.years .ybtn{flex:none}
.myhint{margin:0;padding:10px 14px;border-radius:12px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.45);font-size:19px;line-height:1.55;color:var(--muted,#C9D0F5)}
.myhint b{color:#FFD23F}
.myhint.flash{animation:hintflash 1.1s ease}
@keyframes hintflash{0%,100%{background:rgba(255,210,63,.12)}30%{background:rgba(255,210,63,.5)}}
.scard.view .selbtn{cursor:default;opacity:.82}
.name-in[readonly]{opacity:.9;cursor:not-allowed}
.years h2,.schools h2{margin:0;font-size:18px;font-weight:500;color:var(--muted)}
.ybtn{height:56px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--text);
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;text-align:left;padding:0 20px}
.ybtn.on{border:3px solid var(--yellow);background:var(--panel2)}
.schools{flex:1;min-width:0;background:var(--panel);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:16px}
.shead input{width:280px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:21px;padding:0 14px;font-family:inherit}
.snone{grid-column:1/-1;color:var(--muted);font-size:21px;padding:16px 4px}
.shead span{font-size:18px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;flex:1;min-height:0;grid-auto-rows:150px;overflow-y:auto;padding:3px}
.scard{position:relative;border-radius:16px;border:2px solid var(--line);background:transparent;color:var(--text);display:flex;min-width:0}
.selbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;padding:18px 18px 54px;border:0;background:none;color:inherit;border-radius:14px}
.scard.on{border:3px solid var(--yellow);background:var(--panel2)}
.scard .nm{font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.scard small{display:block;font-size:18px;color:var(--muted);margin-top:2px}
.rankbtn{position:absolute;right:12px;bottom:12px;height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--line);color:var(--text);font-size:18px;font-weight:700}
.rankbtn:hover{background:#4A54B0}
.scard .ck{position:absolute;right:14px;top:14px}
.enter{flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-radius:20px;padding:16px 24px 16px 32px}
.enter small{font-size:18px;color:var(--muted)}
.enter .jua{font-size:30px;line-height:1.2}

/* 2·3. 우물 */
.field{flex:1;min-height:0;display:flex;gap:16px;padding:24px}
.well{flex:none;width:560px;background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:13px 16px 16px;display:flex;flex-direction:column;gap:8px}
.well.a{border-color:var(--green)} .well.b{border-color:var(--orange)}
.whead{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.tag{flex:none;font-family:'Jua','Noto Sans KR',sans-serif;font-size:18px;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--text)}
.name-in{width:180px;height:44px;border-radius:12px;border:2px solid #4A54B0;background:var(--deep);color:var(--text);
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:24px;padding:0 12px}
.name-in.bad{border-color:#FF6B6B;background:#3A1A2E}
.name-in:focus{outline:3px solid var(--yellow);outline-offset:1px}
.name-big{margin:0;font-size:30px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.cnt{font-size:18px;white-space:nowrap}
.cnt b{font-family:'Jua','Noto Sans KR',sans-serif;font-size:34px;font-weight:400}
.well.a .cnt b{color:var(--green)} .well.b .cnt b{color:var(--orange)}
.grid{display:flex;background:var(--deep);border-radius:14px;overflow:hidden}
.col{width:44px;display:flex;flex-direction:column;border-left:1px solid #232A70}
.cell{height:40px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--panel);position:relative}
.num{height:32px;display:flex;align-items:center;justify-content:center;background:#232A70;font-family:'Jua','Noto Sans KR',sans-serif;font-size:20px}
.col.rolled{background:rgba(255,210,63,.14)}
.col.rolled .num{background:var(--yellow);color:var(--ink)}
.arrows{display:flex}
.arr{width:44px;display:flex;flex-direction:column;align-items:center;gap:6px}
.arr button{width:42px;height:44px;border:0;border-radius:10px;display:flex;align-items:center;justify-content:center}
.arr .up{background:#3A44A8} .arr .dn{background:#2A3180}
.arr button:disabled{opacity:.35;cursor:default}
.winfo{height:94px;display:flex;align-items:center;gap:18px;padding:0 8px;font-size:19px;color:var(--muted)}
.winfo .lg{display:flex;align-items:center;gap:8px}
.winfo .msg{margin-left:auto;color:var(--text);font-size:20px;text-align:right}

.tok{width:32px;height:32px;display:flex;align-items:center;justify-content:center;position:relative}
.tok.hit{animation:shake .28s linear infinite;filter:drop-shadow(0 0 7px #FFD23F)}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-3px) rotate(-9deg)}40%{transform:translateX(3px) rotate(9deg)}60%{transform:translateX(-3px) rotate(-6deg)}80%{transform:translateX(3px) rotate(6deg)}}
.shard{transform-box:fill-box;transform-origin:center;animation:fall .6s cubic-bezier(.2,.7,.3,1) both}
@keyframes fall{from{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.7);opacity:.1}to{transform:none;opacity:1}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--yellow);animation:spark .55s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1.2);opacity:1}to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

/* 강 패널 */
.river{flex:1;min-width:0;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#1A5FB4,#14489A);display:flex;flex-direction:column;gap:10px;padding:16px 20px}
.river>svg.waves{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.card{position:relative;background:rgba(18,22,58,.88);border-radius:16px;padding:16px 18px}
.card small{display:block;font-size:17px;color:var(--muted)}
.card h1{margin:2px 0 6px;font-size:26px;line-height:1.2}
.card p{margin:0;font-size:19px;line-height:1.5;color:#E3E7FF}
.prog{margin-bottom:12px}
.prog:last-child{margin-bottom:0}
.prog .row{display:flex;justify-content:space-between;font-size:19px;margin-bottom:6px;gap:8px}
.prog .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>div{height:12px;border-radius:6px;transition:width .2s}
.speed label{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;margin-bottom:8px}
.speed label b{font-family:'Jua','Noto Sans KR',sans-serif;font-size:20px;font-weight:400;color:var(--yellow)}
.speed input{width:100%;margin:0;accent-color:var(--yellow)}
.speed .tick{display:flex;justify-content:space-between;font-size:17px;color:var(--muted);margin-top:6px}
.spacer{flex:1}
.river .go{position:relative;height:68px;font-size:32px;padding:0}
.river .go:disabled{font-size:18px}

/* 주사위 */
.rollhead{display:flex;justify-content:space-between;align-items:baseline}
.rollhead h1{margin:0;font-size:26px}
.rollhead span{font-size:18px;color:var(--muted)}
.dice{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:40px;margin:12px 0 4px;height:116px}
.dw{position:relative;width:96px;height:96px;perspective:640px}
.dsh{position:absolute;left:10px;right:10px;bottom:-8px;height:16px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px);opacity:.5}
.tilt{width:96px;height:96px;transform-style:preserve-3d}
.tilt.t1{transform:rotateX(-16deg) rotateY(14deg) rotateZ(-5deg)}
.tilt.t2{transform:rotateX(-16deg) rotateY(-14deg) rotateZ(6deg)}
.cube{position:relative;width:96px;height:96px;transform-style:preserve-3d}
.face{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:14px;background:#F4F6FF;box-shadow:inset 0 0 0 3px #D5DAF3,inset 0 -8px 14px rgba(18,22,58,.12);backface-visibility:hidden}
.face svg{display:block}
.eq{text-align:center;font-size:24px;color:#E3E7FF;height:30px;margin-top:4px}
.total{text-align:center;font-family:'Jua','Noto Sans KR',sans-serif;font-size:54px;line-height:1.05;color:var(--yellow);height:58px}
.say{text-align:center;font-size:19px;color:#E3E7FF;margin-top:6px;min-height:22px}
.hist{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start;height:56px;overflow-y:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:#6B76D6 transparent}
.hist::-webkit-scrollbar{width:8px}.hist::-webkit-scrollbar-thumb{background:#6B76D6;border-radius:4px}.hist::-webkit-scrollbar-track{background:transparent}
.hist i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;
  font-family:'Jua','Noto Sans KR',sans-serif;font-size:18px;background:var(--line);color:var(--text)}
.hist i.last{background:var(--yellow);color:var(--ink)}
.cardlbl{font-size:18px;color:var(--muted);margin-bottom:10px}
.row2{display:flex;gap:10px;position:relative}
.row2 .ghost{flex:1}

/* 4. 결과 */
.result{flex:1;min-height:0;display:flex;gap:24px;padding:24px 32px}
.win{flex:none;width:600px;min-height:0;overflow-y:auto;background:var(--panel);border:3px solid var(--green);border-radius:24px;padding:18px 32px 12px;display:flex;flex-direction:column;align-items:center;gap:9px}
.win.tie{border-color:var(--yellow)}
.win.o{border-color:var(--orange)}
.win.none{border-color:var(--line)}
.win>*{flex-shrink:0}
.win h1{margin:0;font-size:52px;line-height:1.2;text-align:center;max-width:520px;overflow-wrap:anywhere}
.win .big{font-family:'Jua','Noto Sans KR',sans-serif;font-size:32px;color:var(--yellow)}
.win p{margin:0;font-size:20px;color:#E3E7FF;text-align:center;line-height:1.5}
.saved{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;background:#1E4D3A;font-size:21px;margin-top:4px}
.saved.warn{background:#5A3F12}
.saved.err{background:#4A2A3A}
.minilbl{width:100%;font-size:19px;color:var(--muted)}
.mini{display:flex;background:var(--deep);border-radius:12px;overflow:hidden;align-self:center}
.mini .mc{width:40px;display:flex;flex-direction:column;border-left:1px solid #232A70}
.mini .mc>*{flex-shrink:0}
.mini .mcell{display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--panel)}
.mini .mnum{height:26px;display:flex;align-items:center;justify-content:center;background:#232A70;font-family:'Jua','Noto Sans KR',sans-serif;font-size:19px}
.board{min-height:0;flex:1;min-width:0;background:var(--panel);border-radius:24px;padding:24px 28px;display:flex;flex-direction:column;gap:12px}
.bhead{display:flex;align-items:center;justify-content:space-between}
.bhead small{display:block;font-size:18px;color:var(--muted)}
.bhead h2{margin:0;font-size:36px;line-height:1.15}
.mode{font-size:17px;padding:5px 12px;border-radius:999px;background:var(--line);color:#E3E7FF}
.mode.local{background:#5A3F12}
.cols,.rowx{display:grid;grid-template-columns:72px minmax(0,1fr) 150px 240px;align-items:center;padding:0 16px}
.cols{font-size:18px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:#6B76D6 transparent}
.cnt{font-size:20px;color:var(--muted);margin-left:8px}
.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.findrow{display:flex;gap:8px}
.clsrow{display:flex;align-items:center;gap:8px;font-size:19px;color:var(--muted)}
.clsrow select{height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:19px;padding:0 10px;font-family:inherit}
.rcl{margin-left:8px;font-size:15px;color:var(--muted)}
.findrow input{width:200px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:20px;padding:0 12px;font-family:inherit}
.pbtn{height:40px;min-width:40px;border:0;border-radius:10px;background:var(--line);color:var(--text);font-size:20px;font-family:inherit}
.pbtn.wide{font-size:20px;padding:0 18px}.pbtn:disabled{opacity:.35}
.mybtn{height:40px;border:2px solid var(--green);border-radius:10px;background:transparent;color:var(--text);font-size:19px;padding:0 14px;font-family:inherit}
.mybtn.o{border-color:var(--orange)}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:auto;padding-top:4px;color:var(--muted);font-size:20px}

<script>
/* =====================================================================
   선생님 설정  ← 여기만 고치면 돼요
   ===================================================================== */
const CONFIG = {
  years:     [2026],                      // 처음에 보여줄 학년도  (늘리려면 게임 첫 화면의 '관리자'에서 추가해요)
  schools:   ['선운중학교'],                // 처음에 보여줄 학교    (늘리려면 게임 첫 화면의 '관리자'에서 추가해요)
  apiUrl:    '/api/scores',               // 순위 저장 서버 주소 (서버가 없으면 이 컴퓨터에만 저장돼요)
  configUrl: '/api/config',               // 학년도·학교 목록 서버 주소
  pageSize:  10                           // 순위표 한 쪽에 보여줄 인원
};
/* ===================================================================== */

(function () {
'use strict';

/* ---------- 도구 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand6 = () => 1 + Math.floor(Math.random() * 6);
const rid = () => Math.random().toString(36).slice(2, 10);

const SPEEDS = [null,
  { label: '느리게',      roll: 1500, hit: 1100, gap: 900 },
  { label: '보통',        roll: 900,  hit: 700,  gap: 500 },
  { label: '빠르게',      roll: 500,  hit: 400,  gap: 220 },
  { label: '아주 빠르게', roll: 260,  hit: 200,  gap: 60  }
];

/* ---------- 아이콘 ---------- */
const COLOR = { a: '#5BD97F', b: '#FF8A2B' };
const CUC = '<path d="M16 9 L16.4 4.2" fill="none" stroke="#8BC34A" stroke-width="3.2" stroke-linecap="round"/><path d="M16.4 4.2 C18 3.2 20 3.6 20.6 5 C19 5.6 17.4 5.4 16.4 4.2Z" fill="#3DDC84"/><path d="M16 9 C16 9 9.6 9.6 9.6 14 L9.6 24.5 C9.6 28 12.4 30.4 16 30.4 C19.6 30.4 22.4 28 22.4 24.5 L22.4 14 C22.4 9.6 16 9 16 9Z" fill="#4CC76E"/><path d="M16 9 C16 9 22.4 9.6 22.4 14 L22.4 24.5 C22.4 28 19.6 30.4 16 30.4 C18.6 28.8 19 25 19 22 L19 13 C19 10.4 17.4 9.3 16 9Z" fill="#2F9E52"/><path d="M13.2 14 V22" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round"/><circle cx="15.2" cy="16.5" r="0.9" fill="#1E7A3C"/><circle cx="17.2" cy="21" r="0.9" fill="#1E7A3C"/><circle cx="14.8" cy="25.5" r="0.9" fill="#1E7A3C"/><path d="M13.5 8.8 C14.5 8 17.5 8 18.5 8.8 L16 10.2Z" fill="#7BD88F"/>';
const CAR = '<path d="M7 12 Q16 5 25 12 L16 30 Z" fill="#FF8A2B"/><path d="M16 9 C13 6 13 3 15 1.5 C16.5 3.5 16.5 6 16 9Z" fill="#3DDC84"/><path d="M16 9 C19 6 19 3 17 1.5 C15.5 3.5 15.5 6 16 9Z" fill="#2FBF71"/><path d="M11 15 H14.5 M17.5 19.5 H20.5 M14.5 23 H17" stroke="#C25A0A" stroke-width="1.6" stroke-linecap="round"/>';
const icon = (p, s) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true">${p === 'a' ? CUC : CAR}</svg>`;
function brokenSvg(p, s) {
  const c = COLOR[p];
  return `<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="17" r="12" fill="none" stroke="${c}" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path class="shard" style="--dx:-9px;--dy:-12px;--r:-50deg" d="M7 20 L14 15 L13 25 Z" fill="${c}" fill-opacity="0.55"/>
    <path class="shard" style="--dx:11px;--dy:-9px;--r:60deg" d="M18 12 L25 16 L19 21 Z" fill="${c}" fill-opacity="0.55"/>
    <path class="shard" style="--dx:2px;--dy:-14px;--r:35deg" d="M16 24 L23 22 L21 28 Z" fill="${c}" fill-opacity="0.4"/></svg>`;
}
/* 주사위(3D 상자) : 마주 보는 면의 합이 7이 되도록 1-6, 3-4, 2-5를 배치 */
const PIPS = { 1: [[48, 48]], 2: [[30, 30], [66, 66]], 3: [[30, 30], [48, 48], [66, 66]],
  4: [[30, 30], [66, 30], [30, 66], [66, 66]], 5: [[30, 30], [66, 30], [48, 48], [30, 66], [66, 66]],
  6: [[30, 30], [66, 30], [30, 48], [66, 48], [30, 66], [66, 66]] };
const pipSvg = n => `<svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">${PIPS[n].map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="8.5" fill="#12163A"/>`).join('')}</svg>`;
const FACE_T = { 1: 'rotateY(0deg) translateZ(48px)', 6: 'rotateY(180deg) translateZ(48px)', 3: 'rotateY(90deg) translateZ(48px)',
  4: 'rotateY(-90deg) translateZ(48px)', 2: 'rotateX(90deg) translateZ(48px)', 5: 'rotateX(-90deg) translateZ(48px)' };
const FACE_TO_FRONT = { 1: [0, 0], 6: [0, 180], 3: [0, -90], 4: [0, 90], 2: [-90, 0], 5: [90, 0] };   // [rotateX, rotateY]
const rot = (x, y, z) => `rotateX(${x}deg) rotateY(${y}deg) rotateZ(${z}deg)`;
const cubeHTML = (i, n) => `<div class="dw" id="dw${i}" role="img" aria-label="주사위 ${i}"><div class="dsh" id="dsh${i}"></div>
  <div class="tilt t${i}"><div class="cube" id="cube${i}" style="transform:${rot(FACE_TO_FRONT[n][0], FACE_TO_FRONT[n][1], 0)}">${[1, 2, 3, 4, 5, 6].map(f => `<div class="face" style="transform:${FACE_T[f]}">${pipSvg(f)}</div>`).join('')}</div></div></div>`;
/* 위에서 던져 → 튕기고 → 굴러서 멈춰요 (결과 숫자가 앞면으로 오도록 끝 각도를 맞춰요) */
function throwDie(i, n, ms) {
  const wrap = el('dw' + i), cube = el('cube' + i), sh = el('dsh' + i);
  if (!wrap || !cube || !sh) return Promise.resolve();
  const dir = i === 1 ? -1 : 1, dx = Math.min(150, window.innerWidth * 0.2) * dir;
  const spin = () => (Math.random() < 0.5 ? -1 : 1) * 360 * (1 + Math.floor(Math.random() * 2));
  const [ex, ey] = FACE_TO_FRONT[n];
  const endT = rot(ex + spin(), ey + spin(), 0);
  const startT = rot(Math.round(Math.random() * 360), Math.round(Math.random() * 360), Math.round((Math.random() - 0.5) * 120));
  cube.style.transform = endT;                // 끝 모양을 미리 정해 두면, 애니메이션이 끝난 뒤에도 그대로 남아요
  const down = 'cubic-bezier(.45,0,1,1)', up = 'cubic-bezier(0,0,.4,1)';
  const anims = [
    cube.animate([{ transform: startT }, { transform: endT }], { duration: ms, easing: 'cubic-bezier(.12,.55,.25,1)' }),
    wrap.animate([
      { transform: `translate(${dx}px,-120px) scale(1.2)`, offset: 0, easing: down },
      { transform: `translate(${dx * 0.22}px,0px) scale(1)`, offset: 0.36, easing: up },
      { transform: `translate(${dx * 0.08}px,-44px) scale(1.03)`, offset: 0.52, easing: down },
      { transform: 'translate(0px,0px) scale(1)', offset: 0.66, easing: up },
      { transform: 'translate(0px,-15px) scale(1.01)', offset: 0.78, easing: down },
      { transform: 'translate(0px,0px) scale(1)', offset: 0.88 },
      { transform: 'translate(0px,0px) scale(1)', offset: 1 }
    ], { duration: ms }),
    sh.animate([
      { transform: 'translateY(120px) scaleX(.5)', opacity: 0.12, offset: 0 },
      { transform: 'translateY(0px) scaleX(1)', opacity: 0.55, offset: 0.36 },
      { transform: 'translateY(44px) scaleX(.75)', opacity: 0.25, offset: 0.52 },
      { transform: 'translateY(0px) scaleX(1)', opacity: 0.55, offset: 0.66 },
      { transform: 'translateY(15px) scaleX(.9)', opacity: 0.4, offset: 0.78 },
      { transform: 'translateY(0px) scaleX(1)', opacity: 0.5, offset: 0.88 },
      { transform: 'translateY(0px) scaleX(1)', opacity: 0.5, offset: 1 }
    ], { duration: ms })
  ];
  return Promise.all(anims.map(a => a.finished.catch(() => {})));
}
const chev = up => `<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="${up ? 'M3 10.5 L8 5.5 L13 10.5' : 'M3 5.5 L8 10.5 L13 5.5'}" fill="none" stroke="#F4F6FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const WAVES = `<svg class="waves" aria-hidden="true" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round">${[60,160,260,360,460,560,660].map(y => `<path d="M-20 ${y} Q30 ${y-24} 80 ${y} T180 ${y} T280 ${y} T380 ${y} T480 ${y}"/>`).join('')}</g></svg>`;

/* ---------- 저장 (서버 → 안 되면 이 컴퓨터) ---------- */
const TEST = () => { try { return Number(localStorage.getItem('mtryu.test')) > Date.now(); } catch (e) { return false; } };   // 관리자 화면의 '테스트 모드'가 켜져 있으면 서버에 저장하지 않아요
const Store = {
  mode: 'server',
  key: (y, s) => (TEST() ? 'T:' : '') + 'rd_scores:' + y + ':' + s,   // 테스트 모드의 기록은 이 컴퓨터에만, 따로 모아요
  localList(y, s) { try { return JSON.parse(localStorage.getItem(Store.key(y, s)) || '[]'); } catch (e) { return []; } },
  sortRecs(l) { return l.slice().sort((p, q) => p.rolls - q.rolls || q.ts - p.ts); },
  ties(l) { let pv = null, pr = 0; return l.map((r, i) => { const k = i && r.rolls === pv ? pr : i + 1; pv = r.rolls; pr = k; return Object.assign({}, r, { rank: k }); }); },   // 공동 순위 (300·200·200·100 → 1·2·2·4)
  async http(method, url, body, opt) {
    opt = opt || {};
    if (TEST() && !(method === 'GET' && url === CONFIG.configUrl)) throw new Error('test');   // 테스트 모드: 서버에는 아무것도 보내지 않아요 (학교 목록 읽기만 가능)
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), opt.timeout || 5000);
    try {
      const headers = Object.assign(body ? { 'Content-Type': 'application/json' } : {}, opt.headers || {});
      const r = await fetch(url, { method, signal: ctl.signal, headers, body: body ? JSON.stringify(body) : undefined });
      if (!r.ok) { const er = new Error('http ' + r.status); er.status = r.status; throw er; }
      return await r.json();
    } finally { clearTimeout(t); }
  },
  clsOK(r, cls) { return !cls || (cls === r.gr + '-' + r.cl); },   // cls: '2-3' (2학년 3반) 또는 '' (전체)
  async classes(y, s) {   // 학년·반별 기록 수 (반 고르기 목록)
    if (Store.mode !== 'local') {
      try { const j = await Store.http('GET', CONFIG.apiUrl + '?year=' + encodeURIComponent(y) + '&school=' + encodeURIComponent(s) + '&classes=1', null, { timeout: 8000 }); if (j && Array.isArray(j.classes)) return j.classes; } catch (e) {}
    }
    const map = {}; Store.localList(y, s).forEach(r => { if (Number.isInteger(r.gr) && Number.isInteger(r.cl)) { const k = r.gr + '-' + r.cl; map[k] = (map[k] || 0) + 1; } });
    return Object.keys(map).map(k => { const [gr, cl] = k.split('-').map(Number); return { gr, cl, n: map[k] }; }).sort((a, b) => a.gr - b.gr || a.cl - b.cl);
  },
  async page(y, s, offset, limit, cls) {
    try {
      let j = null;
      for (let k = 0; k < 2 && !j; k++) { try { j = await Store.http('GET', CONFIG.apiUrl + '?year=' + encodeURIComponent(y) + '&school=' + encodeURIComponent(s) + '&offset=' + offset + '&limit=' + limit + (cls ? '&cls=' + cls : ''), null, { timeout: 9000 }); } catch (e) { if (k) throw e; } }   // 서버가 깨어나는 데 오래 걸릴 수 있어서 한 번 더 해 봐요
      if (!j || !Array.isArray(j.top)) throw new Error('bad');
      Store.mode = 'server'; return { rows: j.top, total: j.total == null ? j.top.length : j.total };
    } catch (e) {
      Store.mode = 'local';
      const all = Store.ties(Store.sortRecs(Store.localList(y, s)).filter(r => Store.clsOK(r, cls)));
      return { rows: all.slice(offset, offset + limit), total: all.length };
    }
  },
  async find(y, s, q, cls) {
    if (Store.mode === 'server') {
      try {
        const j = await Store.http('GET', CONFIG.apiUrl + '?year=' + encodeURIComponent(y) + '&school=' + encodeURIComponent(s) + '&q=' + encodeURIComponent(q) + (cls ? '&cls=' + cls : ''), null, { timeout: 8000 });

    }
    return Store.ties(Store.sortRecs(Store.localList(y, s)).filter(r => Store.clsOK(r, cls))).filter(r => String(r.name).includes(q)).slice(0, 50);
  },
  async save(y, s, rec) {
    try {
      const j = await Store.http('POST', CONFIG.apiUrl, { year: y, school: s, id: rec.id, name: rec.name, rolls: rec.rolls, setup: rec.setup, lsetup: rec.lsetup, uid: rec.uid, gr: rec.gr, cl: rec.cl });
      if (!j || !Array.isArray(j.top)) throw new Error('bad');
      Store.mode = 'server'; return { rank: j.rank, top: j.top, total: j.total == null ? j.top.length : j.total };
    } catch (e) {
      Store.mode = 'local';
      const l = Store.localList(y, s); l.push(rec);
      try { localStorage.setItem(Store.key(y, s), JSON.stringify(l)); } catch (er) {}
      const sorted = Store.ties(Store.sortRecs(l));
      return { rank: (sorted.find(x => x.id === rec.id) || { rank: 0 }).rank, top: sorted.slice(0, CONFIG.pageSize), total: sorted.length };
    }
  }
};

/* 간단한 해시 (서버가 없을 때 이 컴퓨터용 관리자 암호 확인에만 써요) */
function hash53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

const el = id => document.getElementById(id);

function startGame() {
  const st = { a: state.a.counts.map(c => new Array(c).fill(1)), b: state.b.counts.map(c => new Array(c).fill(1)) };
  G = { id: Date.now() + Math.random(), paused: false, rolls: 0, st, left: { a: 12, b: 12 }, hist: [] };
  runGame(G.id);
}
const alive = () => !!G;
async function gate(id) { while (G && G.id === id && G.paused) await sleep(80); return !!G && G.id === id; }
async function wait(id, ms) { await sleep(ms); return gate(id); }

async function runGame(id) {
  if (!(await wait(id, 600))) return;
  while (G && G.id === id) {
    const sp = SPEEDS[state.speed];
    G.rolls++;
    el('rollNo').textContent = G.rolls + '번째 굴림';
    el('rollSt').textContent = '주사위 굴리는 중';
    el('eq').innerHTML = '&nbsp;'; el('total').textContent = '…'; el('say').innerHTML = '&nbsp;';
    document.querySelectorAll('.col.rolled').forEach(c => c.classList.remove('rolled'));
    ['a', 'b'].forEach(p => { el('info-' + p).innerHTML = '&nbsp;'; });

    /* 주사위 굴리기: 위에서 던져 튕기고 굴러서 멈춰요 */
    const x = rand6(), y = rand6(), s = x + y;
    await Promise.all([throwDie(1, x, sp.roll), throwDie(2, y, sp.roll)]);
    if (!G || G.id !== id) return;
    if (!(await gate(id))) return;
    el('eq').textContent = x + ' + ' + y + ' =';
    el('total').textContent = s;
    el('rollSt').innerHTML = '&nbsp;';
    document.querySelectorAll('.col[id$="-' + s + '"]').forEach(c => c.classList.add('rolled'));

    /* 맨 위 토큰 찾기 */
    const hits = [];
    ['a', 'b'].forEach(p => {
      const arr = G.st[p][s - 1];
      let k = arr.lastIndexOf(1);
      if (k >= 0) hits.push({ p, i: s - 1, k });
    });
    hits.forEach(h => el('t-' + h.p + '-' + h.i + '-' + h.k).classList.add('hit'));
    el('say').textContent = hits.length ? s + '번 칸의 맨 위 토큰이 부서져요' : s + '번 칸에는 부술 토큰이 없어요';
    if (!(await wait(id, sp.hit))) return;

    /* 부수기 */
    hits.forEach(h => {
      G.st[h.p][h.i][h.k] = 0; G.left[h.p]--;
      const t = el('t-' + h.p + '-' + h.i + '-' + h.k);
      t.classList.remove('hit');
      let parts = '';
      for (let n = 0; n < 7; n++) { const ang = n / 7 * Math.PI * 2; parts += `<i style="--x:${Math.round(Math.cos(ang) * 22)}px;--y:${Math.round(Math.sin(ang) * 22)}px"></i>`; }
      t.innerHTML = brokenSvg(h.p, 32) + `<span class="burst">${parts}</span>`;
      el('left-' + h.p).textContent = G.left[h.p];
    });
    ['a', 'b'].forEach(p => {
      const broke = hits.some(h => h.p === p);
      el('info-' + p).textContent = broke ? s + '번 칸 토큰이 부서졌어요' : s + '번 칸엔 토큰이 없어요';
    });
    G.hist.push(s);
    const hb = el('hist');
    hb.innerHTML = G.hist.map((v, i, arr) => `<i${i === arr.length - 1 ? ' class="last"' : ''}>${v}</i>`).join('');
    hb.scrollTop = hb.scrollHeight; el('histN').textContent = '· ' + G.hist.length + '번';

    /* 끝났는지 */
    const done = ['a', 'b'].filter(p => G.left[p] === 0);
    if (done.length) { await wait(id, 700); if (G && G.id === id) finish(done); return; }
    const reach = p => G.left[p] - G.st[p][0].filter(v => v === 1).length;   // 1번 칸 토큰은 부술 수 없어요
    if (reach('a') === 0 && reach('b') === 0) { await wait(id, 900); if (G && G.id === id) finish([], true); return; }

    if (!(await wait(id, sp.gap))) return;
  }
}

/* ---------- 4. 결과 ---------- */
async function finish(winners, stalemate) {
  const rolls = G.rolls, left = { a: G.left.a, b: G.left.b };
  G = null;
  state.result = { winners, rolls, stalemate: !!stalemate, saved: null, rank: {}, ids: {}, top: [], total: 0, offset: 0, matches: null, q: '', cls: defCls(), classes: [], status: winners.length ? 'saving' : 'none' };
  endPopup(winners, stalemate, rolls, left);   // 게임 화면은 그대로 두고, 작은 알림만 띄워요 ('순위 보기'를 누르면 결과 화면으로)
  if (!winners.length) return;
  let last = null;
  enforceMine();
  for (const p of winners) {
    const rec = { id: rid(), name: cleanName(state[p].name), rolls, setup: state[p].counts.slice(), ts: Date.now() };
    if (winners.length === 1) rec.lsetup = state[p === 'a' ? 'b' : 'a'].counts.slice();   // 진 쪽 처음 배치도 함께 (이름은 저장하지 않아요)

function miniWell(p, counts, budget) {
  const rows = Math.max(3, Math.max.apply(null, counts));
  const h = Math.max(10, Math.min(28, Math.floor(budget / rows)));
  const ic = Math.max(8, h - 5);
  const cols = counts.map((c, i) => {
    let cells = '';
    for (let r = 0; r < rows; r++) cells += `<div class="mcell" style="height:${h}px">${(rows - 1 - r) < c ? icon(p, ic) : ''}</div>`;
    return `<div class="mc"><div>${cells}</div><div class="mnum">${i + 1}</div></div>`;
  }).join('');
  return `<div class="mini" role="img" aria-label="처음 배치">${cols}</div>`;
}

    setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = '그만하기'; } }, 3000);
  }

    state.school = b.dataset.v; savePrefs();

  }
  else if (act === 'pg') {
    const R = state.result, PS = CONFIG.pageSize, last = Math.max(0, Math.ceil(R.total / PS) - 1) * PS, v = b.dataset.v;
    const to = v === 'first' ? 0 : v === 'last' ? last : v === 'prev' ? R.offset - PS : R.offset + PS;
    loadPage(Math.min(Math.max(to, 0), last));
  }
  else if (act === 'gomine') { const rk = state.result.rank[b.dataset.p]; if (rk) { state.result.cls = ''; state.result.q = ''; } if (rk) loadPage(Math.floor((rk - 1) / CONFIG.pageSize) * CONFIG.pageSize); }

  }

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.rid !== undefined) {
    if (t.checked) REC.sel.add(t.dataset.rid); else REC.sel.delete(t.dataset.rid);
    const row = t.closest('.recrow'); if (row) row.classList.toggle('on', t.checked);
    const d = document.getElementById('recdel'); if (d) { d.disabled = !REC.sel.size; d.textContent = '선택한 ' + REC.sel.size + '건 삭제'; delete d.dataset.sure; }
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const k = f.dataset.form;
  if (k === 'recfind') {
    const q = document.getElementById('recQ').value.trim(); REC.q = q; REC.msg = '';
    if (!q) { REC.matches = null; paintRecs(); return; }
    recFind(q).then(m => { REC.matches = m; paintRecs(); }).catch(() => { REC.msg = '찾지 못했어요. 다시 시도해 주세요.'; paintRecs(); });
  }
  else if (k === 'find') runFind(document.getElementById('findQ').value.trim());
  else if (k === 'login') tryLogin(document.getElementById('admPw').value);
  else adminAdd(k);
});
document.addEventListener('change', e => {   // 순위표의 반 고르기
  if (e.target && e.target.id === 'clsSel' && state.result) { const R = state.result; R.cls = e.target.value; R.q = ''; R.matches = null; loadPage(0); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.name) {
    if (!e.isComposing && /\s/.test(t.value)) t.value = t.value.replace(/\s+/g, '');   // 붙여 넣은 띄어쓰기도 지워요
    state[t.dataset.name].name = t.value; updateReady(); savePrefs();
  }
  if (t.id === 'schoolQ') { SQ.q = t.value; el('sgrid').innerHTML = schoolCards(); searchPublic(t.value); }
  if (t.id === 'admSchool') searchSchools(t.value);
  if (t.id === 'delYear' || t.id === 'delSchool') { REC.open = false; REC.sel = new Set(); }
  if (t.id === 'delYear') { ADM.delYear = Number(t.value); ADM.msg = ''; show('admin'); }
  if (t.id === 'delSchool') { ADM.delSchool = t.value; ADM.msg = ''; show('admin'); }
  if (t.id === 'speed') { state.speed = Number(t.value); el('speedLbl').textContent = SPEEDS[state.speed].label; savePrefs(); }
});
document.addEventListener('compositionend', e => {
  const t = e.target;
  if (t.dataset && t.dataset.name && /\s/.test(t.value)) { t.value = t.value.replace(/\s+/g, ''); state[t.dataset.name].name = t.value; updateReady(); }
});
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.code === 'Space') && e.target.dataset && e.target.dataset.name) { e.preventDefault(); return; }   // 이름에는 띄어쓰기를 넣지 않아요
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.name) { const s = $('#start'); if (s && !s.disabled) s.click(); }
});

/* ---------- 화면 크기에 맞추기 ---------- */
function fit() {
  const bar = document.getElementById('mtryu-labbar'), barH = bar ? bar.getBoundingClientRect().height : 0;   // 맨 위 실험실 바
  const s = Math.min(window.innerWidth / 1600, (window.innerHeight - barH) / 860);
  $('#stage').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); window.addEventListener('load', fit); fit();
/* 실험실 바의 링크를 눌렀을 때, 게임 도중이면 한 번 물어봐요 */
window.addEventListener('labbar:navigate', e => {
  if (state.screen === 'play' && !confirm('게임을 그만하고 나갈까요?')) e.preventDefault();
});

/* 개발·점검용 (학생 화면에는 영향 없음) */
window.__rd = { state, get game() { return G; }, SPEEDS, Store, throwDie };

show('setup');
/* ---------- 내 정보 (me-sync.js · lab-bar.js) ----------
   내 정보가 있으면 학교와 1P 이름(별명)은 항상 내 것으로 고정돼요. 바꾸려면 오른쪽 위 이름표를 눌러요.
   순위에 올라가는 이름은 별명이고(학년·반도 같이), 실명·번호는 이 게임에 오지 않아요. */
async function syncMe() {
  const m = MtryuMeSync.read();
  if (!m) { ME = null; return; }   // 정보가 없으면 lab-bar.js가 입력창을 띄워 둬요
  let r;
  try { r = await MtryuMeSync.resolve(LIST.schools, LIST.regions, CONFIG.configUrl); } catch (e) { r = { me: m, label: null, retry: true }; }
  if (r && r.list && okList(r.list)) { applyList(r.list); LIST.regions = r.list.regions || {}; writeLocalList(); }
  if (!r || !r.label) {
    ME = null;
    if (r && r.retry) MtryuMeSync.block({ title: '학교를 불러오지 못했어요', text: '내 학교를 순위 서버에 올리는 중에 잠깐 문제가 생겼어요. 잠시 뒤에 다시 해 주세요.', label: '다시 시도', onClick: () => location.reload() });
    else MtryuMeSync.block({ title: '학교를 다시 골라 주세요', text: '순위는 나이스에서 찾은 학교로만 올라가요. 내 정보에서 학교를 검색해서 다시 골라 주세요.', label: '학교 다시 고르기', onClick: () => window.MtryuMe && window.MtryuMe.openDialog({ required: true, strict: true }) });
    return;
  }
  MtryuMeSync.unblock();
  ME = { nick: cleanName(m.nick), uid: m.uid, label: r.label, gr: m.gr, cl: m.cl };   // 학년·반은 순위에 같이 올라가요 (번호는 안 보내요)
}
function enforceMine() {   // 학교와 1P 이름을 내 것으로 맞춰요
  if (!ME) return;
  state.school = ME.label; state.a.name = ME.nick; prefs.school = ME.label;
}
async function refreshMe() {
  await syncMe(); enforceMine(); savePrefs();
  if (state.screen === 'setup') show('setup');
  else if (state.screen === 'place') { $('#screen').innerHTML = placeHTML(); updateReady(); }
}
MtryuMeSync.watch(refreshMe);
loadList().then(async () => { await syncMe(); fixSelection(true); enforceMine(); if (ME) savePrefs(); if (state.screen === 'setup') show('setup'); });
})();
</script>
