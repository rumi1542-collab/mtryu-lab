<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확률 실험 시뮬레이터 · 확률 실험실</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#7719AA">
<meta name="description" content="내가 만드는 확률 실험 — 도구와 경우를 정하고 던져 보며 도수·상대도수를 살펴봐요. 우리 학교 친구들의 실험은 결과만 보고 가능성이 같은지 판단해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B0F3F;--muted:#5A4670;--line:#E6D8F2;--bg:#F8F2FC;--purple:#7719AA;--pink:#D81B7A;--tint:#F0DDFA;--ok:#0F7B4B;--bad:#B3261E;
  /* 경우별 색: 검증된 범주형 팔레트 8색 (순서 고정) */
  --s0:#2a78d6;--s1:#eb6834;--s2:#1baf7a;--s3:#eda100;--s4:#e87ba4;--s5:#008300;--s6:#6250d6;--s7:#e34948;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:calc(100vh - var(--labbar-h,0px));background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:var(--ink);padding:28px 16px 64px}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
input::placeholder{color:#7B6B8F;opacity:1}
.wrap{width:100%;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
#app{display:flex;flex-direction:column;gap:20px;min-width:0}
#res1,#res2{display:flex;flex-direction:column;gap:18px}
#res1:empty,#res2:empty,#pubbox:empty,#judge:empty{display:none}
[hidden]{display:none!important}

/* 머리글 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumb{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;background:#fff;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-size:15px;font-weight:700}
.crumb:hover{background:var(--tint)}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ic{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:var(--tint);border:2px solid var(--ink)}
h1{margin:0;font-size:clamp(26px,4.6vw,36px);line-height:1.25;font-weight:900}
h1 em{font-style:normal;color:var(--purple)}
.hero p{margin:0;font-size:17px;line-height:1.6;color:var(--muted)}
h2{margin:0;font-size:20px;line-height:1.35;font-weight:900}
h3{margin:0;font-size:17px;font-weight:700}
.hint{margin:0;font-size:15px;line-height:1.6;color:var(--muted)}

/* 카드·버튼 */
.card{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:20px;box-shadow:4px 4px 0 var(--purple);display:flex;flex-direction:column;gap:14px;min-width:0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:22px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--purple);transition:transform .15s,box-shadow .15s}
.choice:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--pink)}
.choice .tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--purple)}
.choice b{font-size:19px;line-height:1.4;font-weight:900}
.choice span.ex{font-size:15px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 20px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:16px;font-weight:700;color:var(--ink);text-decoration:none}
.btn:hover:not(:disabled){background:var(--tint)}
.btn.primary{background:var(--purple);color:#fff;box-shadow:3px 3px 0 var(--pink)}
.btn.primary:hover:not(:disabled){background:#650F91}
.btn.pink{background:var(--pink);color:#fff}
.btn.pink:hover:not(:disabled){background:#B5155F}
.btn.sm{min-height:40px;padding:4px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
:is(button,input,select,a,[tabindex]):focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.actions .grp{display:flex;gap:10px;flex-wrap:wrap}
.msg{margin:0;font-size:15px;line-height:1.5;min-height:1.5em}
.msg.err{color:var(--bad);font-weight:500}
.msg.ok{color:var(--ok);font-weight:500}

/* 입력 */
input[type=text],input[type=number],input:not([type]),select{height:46px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:0 12px;font-size:17px;min-width:0}
input[type=number]{width:120px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--muted)}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{min-height:36px;padding:2px 12px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:14px;font-weight:700;color:var(--muted)}
.quick button:hover,.quick button[aria-pressed=true]{border-color:var(--purple);color:var(--purple)}
.quick button[aria-pressed=true]{background:var(--tint)}

/* 경우 목록 */
.crow{display:flex;align-items:center;gap:8px}
.crow .badge{flex:none;width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;text-shadow:0 0 2px rgba(0,0,0,.35)}
.crow input.cn{flex:1;min-width:0}
.crow input.cw{width:132px;flex:none;text-align:right}
.crow .del{flex:none;width:40px;height:40px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:18px;color:var(--muted)}
.crow .del:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.crow .del:disabled{opacity:.35;cursor:not-allowed}
.colh{display:flex;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.sumline{font-size:15px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--tint);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sumline.ok{color:var(--ok)}.sumline.bad{color:var(--bad)}
.eqbox{padding:12px 14px;border-radius:12px;background:var(--tint);font-size:16px;line-height:1.6}

/* 경우 색 */
.kn{--c:#7719AA}.k0{--c:var(--s0)}.k1{--c:var(--s1)}.k2{--c:var(--s2)}.k3{--c:var(--s3)}.k4{--c:var(--s4)}.k5{--c:var(--s5)}.k6{--c:var(--s6)}.k7{--c:var(--s7)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 6px;border-radius:999px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);font-size:15px;font-weight:500;line-height:1.3}
.chip i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* 실험하기 */
.exphead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.exphead .ttl{display:flex;flex-direction:column;gap:8px;min-width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:46px;padding:8px 18px;border:2px solid var(--ink);border-radius:12px 12px 0 0;background:#fff;font-size:16px;font-weight:700;color:var(--muted)}
.tab[aria-selected=true]{background:var(--purple);color:#fff;border-color:var(--purple)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px;align-items:start}
.logbox{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start;height:200px;overflow-y:auto;padding:10px;border:2px solid var(--line);border-radius:12px;background:#FCFAFE;scrollbar-width:thin;scrollbar-color:var(--purple) transparent}
.logbox::-webkit-scrollbar{width:8px}.logbox::-webkit-scrollbar-thumb{background:var(--purple);border-radius:4px}
.rc{font-style:normal;font-size:14px;font-weight:700;line-height:1;padding:6px 8px;border-radius:8px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);white-space:nowrap}
.rc.w{font-weight:500}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:14px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--ink)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.scrolltbl{max-height:260px;overflow:auto;border:2px solid var(--line);border-radius:12px}
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:inherit;fill:var(--muted);font-size:12px}
.chart .val{fill:var(--ink);font-weight:700;font-size:13px}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--ink);stroke-width:1.5}
.tip{position:absolute;pointer-events:none;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.5;box-shadow:3px 3px 0 var(--purple);z-index:3;white-space:nowrap}
.tip b{font-weight:900}
.opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:15px}
.opts label{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.opts input[type=checkbox]{width:20px;height:20px;accent-color:var(--purple)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{padding:12px 14px;border-radius:12px;background:var(--tint);display:flex;flex-direction:column;gap:2px}
.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.stat b{font-size:22px;font-weight:900}

/* 판정 */
.judge .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:12px 16px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:17px;font-weight:700}
.judge .opt[aria-pressed=true]{background:var(--purple);color:#fff;box-shadow:3px 3px 0 var(--pink)}
.judge .opt:disabled{opacity:.5;cursor:not-allowed}
.vbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr 96px;gap:10px;align-items:center;font-size:16px}
.vbar .track{height:26px;border-radius:8px;background:var(--tint);overflow:hidden}
.vbar .fill{height:100%;background:var(--purple);border-radius:0 8px 8px 0;min-width:2px}
.vbar.n .fill{background:var(--pink)}
.vbar .num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mark{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:#fff;margin-left:6px;vertical-align:middle}

/* 목록 */
.items{display:flex;flex-direction:column;gap:14px}
.item{display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--purple)}
.item .row1{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item .meta{font-size:14px;color:var(--muted)}
.badge2{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--purple);margin-left:6px;vertical-align:middle}
.badge2.done{background:#D8F2E4;color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:16px;line-height:1.7}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:500;max-width:calc(100vw - 32px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.spin{display:inline-block;width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){
  body{padding:16px 10px 56px}
  .card{padding:14px}
  .vbar{grid-template-columns:1fr 80px;}
  .vbar .track{grid-column:1 / -1;order:3}
  input[type=number]{width:100px}
  .crow input.cw{width:112px}
}
@media (prefers-reduced-motion:reduce){.choice,#toast{transition:none}.spin{animation-duration:2s}}
</style>
<script src="/me-sync.js"></script>
<script src="https://mtryu-lab.vercel.app/lab-bar.js" defer></script>

<body>
<main class="wrap">
  <div class="top"><a class="crumb" href="/probability/">← 확률 실험실</a></div>
  <div class="hero">
    <span class="ic"><svg width="28" height="28" viewBox="0 0 40 40" fill="none" stroke="#7719AA" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 33V7"/><path d="M6 33h28"/><rect x="11" y="20" width="5" height="13" rx="1.5"/><rect x="19" y="12" width="5" height="21" rx="1.5"/><rect x="27" y="24" width="5" height="9" rx="1.5"/></svg></span>
    <h1><em>확률 실험 시뮬레이터</em></h1>
    <p id="sub">내가 만드는 확률 실험</p>
  </div>
  <div id="app"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* ---------- 도구 ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SC = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
const MAX_CASES = 30, MIN_CASES = 2, PAL = 8, MAX_ROLL = 10000, MAX_REP_N = 1000, MAX_REP_K = 1000, MAX_REP_TOTAL = 200000;
const fmt = n => Number(n).toLocaleString('ko-KR');
const r3 = x => (Math.round(x * 1000) / 1000).toFixed(3);
const short = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const clampInt = (v, lo, hi) => { const x = Number(String(v).trim()); return Number.isInteger(x) && x >= lo && x <= hi ? x : null; };
let toastT = 0;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 3200); }

/* ---------- 난수: 브라우저의 암호용 난수 ---------- */
function randU32(count) {
  const out = new Uint32Array(count);
  for (let i = 0; i < count; i += 16384) crypto.getRandomValues(out.subarray(i, Math.min(count, i + 16384)));
  return out;
}
function localRoll(p, count) {
  const cum = []; let a = 0;
  for (let i = 0; i < p.length; i++) { a += p[i]; cum.push(a); }
  cum[cum.length - 1] = Infinity;
  const r = randU32(count), out = new Uint8Array(count);
  for (let i = 0; i < count; i++) { const u = r[i] / 4294967296; let k = 0; while (u >= cum[k]) k++; out[i] = k; }
  return out;
}

/* ---------- 서버 ---------- */
const ERR = {
  'too-many': '잠깐 너무 많이 눌렀어요. 조금 뒤에 다시 해 주세요.',
  'bad-experiment': '올릴 수 없는 말이 들어 있거나 값이 맞지 않아요. 이름과 값을 다시 확인해 주세요.',
  'too-many-mine': '올려 둘 수 있는 실험은 10개까지예요. 하나를 지우고 다시 올려 주세요.',
  'bad-name': '내 별명을 쓸 수 없어요. 이름표에서 별명을 바꿔 주세요.',
  'own-experiment': '내가 올린 실험은 친구들이 판정해요.',
  'not-found': '지워졌거나 찾을 수 없는 실험이에요.',
  'bad-count': '던지는 횟수가 너무 많아요. 숫자를 줄여 주세요.',
  'bad-request': '학교 정보가 맞지 않아요. 이름표에서 학교를 다시 골라 주세요.'
};
const errText = e => (e && ERR[e.code]) || '서버와 연결하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.';
async function api(body) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch('/api/sim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { const er = new Error('http ' + r.status); er.code = (j && j.error) || ''; er.status = r.status; throw er; }
    return j;
  } finally { clearTimeout(t); }
}

/* ---------- 내 정보 · 학교 · 학년도 (동전 실험실과 같은 방식) ---------- */
const LIST = { years: [2026], schools: ['선운중학교'], regions: {} };
let ME = null, YEAR = 2026;
function schoolYear() { const d = new Date(Date.now() + 9 * 3600e3); return d.getUTCMonth() >= 2 ? d.getUTCFullYear() : d.getUTCFullYear() - 1; }
const okList = c => c && Array.isArray(c.years) && Array.isArray(c.schools) && c.years.length && c.schools.length;
function takeList(j) { LIST.years = j.years.slice(); LIST.schools = j.schools.slice(); LIST.regions = j.regions || {}; const sy = schoolYear(); YEAR = LIST.years.includes(sy) ? sy : LIST.years[0]; }
async function loadList() { try { const r = await fetch('/api/config'); if (r.ok) { const j = await r.json(); if (okList(j)) takeList(j); } } catch (e) {} }
const cleanNick = s => String(s || '').replace(/[<>\s\u0000-\u001f]/g, '').slice(0, 8);
async function syncMe() {
  ME = null;
  const m = window.MtryuMeSync && MtryuMeSync.read();
  if (!m) return;
  let r; try { r = await MtryuMeSync.resolve(LIST.schools, LIST.regions, '/api/config'); } catch (e) { r = null; }
  if (r && r.list && okList(r.list)) takeList(r.list);
  if (r && r.label) ME = { nick: cleanNick(m.nick), uid: m.uid, label: r.label };
}
// 올리기·목록·판정 전에 서버와 내 정보를 확인해요. 문제가 있으면 안내 글을 돌려줘요. (만들기·실험하기는 서버 없이도 돼요)
async function needReady() {
  if (location.protocol === 'file:') return '이 기능은 인터넷에 올라간 주소에서만 써요. 파일로 열면 만들기와 실험하기만 할 수 있어요.';
  if (!ME) { await loadList(); await syncMe(); }
  if (!ME) return '내 정보(학교·별명)가 필요해요. 위쪽 이름표에서 학교를 나이스로 검색해 골라 주세요.';
  return '';
}

/* ---------- 상태 ---------- */
const S = {
  screen: 'home', mode: null,
  tool: '', cases: [],
  exp: null,          // { tool, names, p (만든 사람만), remote:{id}|null }
  tab: 'once', n1: 100, n2: 20, k2: 50, pick: 0,
  once: null, rep: null, ymode: 'full', hl: -1, showTrue: false, touched: false, exIdx: 0,
  busy: false, ran: false,
  pub: { open: false, busy: false, id: null, key: '', msg: '', err: false },
  list: { items: null, msg: '', err: false, loading: false },
  play: { id: '', my: null, tally: null, mine: false, pick: null, busy: false, msg: '', err: false }
};
let listCount = null;   // 홈에 보여줄 우리 학교 실험 수

const app = $('#app');

/* ---------- 만들기 도우미 ---------- */
// 입력칸은 모두 빈칸으로 시작하고, 흐린 글씨(placeholder)로 예시만 보여줘요.
const EX = {
  equal: [{ tool: '정사면체 주사위', cases: ['1', '2', '3', '4'] }],
  unequal: [
    { tool: '압정', cases: ['침이 위', '침이 아래'], w: ['0.4', '0.6'] },
    { tool: '윷', cases: ['도', '개', '걸', '윷', '모'], w: ['0.25', '0.375', '0.25', '0.0625', '0.0625'] }
  ]
};
const exOf = () => S.mode === 'equal' ? EX.equal[0] : EX.unequal[S.exIdx] || EX.unequal[0];
const blankRows = n => Array.from({ length: n }, () => ({ name: '', w: '' }));
const isBlankAll = () => !S.tool.trim() && S.cases.every(c => !c.name.trim() && !String(c.w).trim());
function defaults(mode) {
  S.tool = ''; S.touched = false; S.exIdx = 0;
  S.cases = blankRows(mode === 'equal' ? EX.equal[0].cases.length : EX.unequal[0].cases.length);
}
function parseW(s) {
  s = String(s).trim().replace(/,/g, '.');
  if (!s) return NaN;
  const fr = s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
  if (fr) return Number(fr[2]) > 0 ? Number(fr[1]) / Number(fr[2]) : NaN;
  return /^\d*\.?\d+$/.test(s) ? Number(s) : NaN;
}
function checkBuild() {
  const errs = [], names = S.cases.map(c => c.name.trim());
  if (!S.tool.trim()) errs.push('도구 이름을 써 주세요.');
  if (names.some(n => !n)) errs.push('이름이 빈 경우가 있어요.');
  else if (new Set(names).size !== names.length) errs.push('같은 이름의 경우가 있어요. 서로 다르게 써 주세요.');
  let p = null, sum = null;
  if (S.mode === 'equal') p = S.cases.map(() => 1 / S.cases.length);
  else {
    const w = S.cases.map(c => parseW(c.w));
    if (w.some(x => !(x > 0 && x <= 1))) errs.push('상대도수는 0보다 크고 1 이하인 수로 써 주세요. (예: 0.25 또는 1/4)');
    else {
      sum = w.reduce((a, c) => a + c, 0);
      if (Math.abs(sum - 1) > 0.001) errs.push('상대도수의 합이 1이 되어야 해요.');
      else p = w.map(x => x / sum);
    }
  }
  return { ok: !errs.length && !!p, errs, p, sum };
}
function sumHtml(ck) {
  if (S.mode !== 'unequal') return '';
  if (ck.sum == null) return '<div class="sumline">상대도수의 합: —</div>';
  const good = Math.abs(ck.sum - 1) <= 0.001;
  return '<div class="sumline ' + (good ? 'ok' : 'bad') + '">상대도수의 합: ' + (Math.round(ck.sum * 10000) / 10000) + (good ? ' ✓' : ' → 합이 1이 되어야 해요') + '</div>';
}
const buildMsg = ck => S.touched ? (ck.errs[0] || '') : '도구 이름과 경우를 직접 써 주세요. 입력칸의 흐린 글씨는 예시예요.';
function updateBuild() {
  const ck = checkBuild();
  const go = $('#go'); if (go) go.disabled = !ck.ok;
  const sm = $('#sumline'); if (sm) sm.innerHTML = sumHtml(ck);
  const m = $('#bmsg'); if (m) { m.textContent = buildMsg(ck); m.className = 'msg' + (S.touched && ck.errs.length ? ' err' : ''); }
  const eq = $('#eqp'); if (eq) eq.textContent = '1/' + S.cases.length;
  const fix = $('#fix'); if (fix) fix.hidden = S.mode !== 'unequal';
}

/* ---------- 실험 결과 계산 ---------- */
function analyzeOnce(idx, m) {
  const n = idx.length, counts = new Array(m).fill(0), xs = [], ys = Array.from({ length: m }, () => []);
  const step = n <= 500 ? 1 : Math.ceil(n / 500);
  for (let i = 0; i < n; i++) {
    counts[idx[i]]++; const t = i + 1;
    if (step === 1 || t <= 20 || t % step === 0 || t === n) { xs.push(t); for (let c = 0; c < m; c++) ys[c].push(counts[c] / t); }
  }
  return { n, idx, counts, xs, ys };
}
function niceStep(raw) { const e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }

/* ---------- 그래프 (SVG, 화면 폭에 맞춰 글자 크기를 유지해요) ---------- */
function barSvg(w, labels, vals, colors, xTitle, yTitle, markX, idxMode) {
  const names = labels, m0 = vals.length, mc = Math.max(2, Math.floor(((w - 64) / m0) / 8));
  if (idxMode && mc < 3 && labels.some(l => String(l).length > mc)) { labels = labels.map((_, i) => String(i + 1)); xTitle = xTitle || '경우 번호 (표의 순서)'; }   // 이름이 안 들어갈 만큼 많으면 번호로
  const h = 320, L = 52, R = 12, T = 26, B = 52 + (xTitle ? 18 : 0), pw = w - L - R, ph = h - T - B, m = vals.length;
  const mx = Math.max(1, Math.max.apply(null, vals)), step = niceStep(mx / 4), ymax = step * Math.ceil(mx / step);
  let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(yTitle) + ' 막대그래프">';
  for (let v = 0; v <= ymax + 1e-9; v += step) {
    const y = T + ph * (1 - v / ymax);
    s += '<line class="gridl" x1="' + L + '" x2="' + (w - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + fmt(v) + '</text>';
  }
  s += '<line class="axis" x1="' + L + '" x2="' + (w - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '"/>';
  const slot = pw / m, bw = Math.min(slot * 0.66, 72), maxCh = Math.max(2, Math.floor(slot / 8));
  const every = slot < 22 ? Math.ceil(22 / slot) : 1;
  vals.forEach((v, i) => {
    const x = L + slot * i + (slot - bw) / 2, hh = ph * v / ymax, y = T + ph - hh, r = Math.min(4, hh);
    const d = hh > 0 ? 'M' + x + ',' + (y + hh) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y + ' ' + (x + bw) + ',' + (y + r) + 'V' + (y + hh) + 'Z' : '';
    s += '<g>' + (d ? '<path d="' + d + '" fill="' + colors[i] + '"/>' : '') + '<title>' + esc(names[i]) + ': ' + fmt(v) + '</title>' +
      (slot >= 16 || v === mx ? '<text class="val" x="' + (x + bw / 2) + '" y="' + (y - 6) + '" text-anchor="middle">' + fmt(v) + '</text>' : '') +
      (i % every === 0 ? '<text x="' + (x + bw / 2) + '" y="' + (T + ph + 18) + '" text-anchor="middle">' + esc(short(labels[i], maxCh)) + '</text>' : '') + '</g>';
  });
  if (markX != null) { const mxp = L + markX * slot; s += '<line x1="' + mxp + '" x2="' + mxp + '" y1="' + T + '" y2="' + (T + ph) + '" stroke="#D81B7A" stroke-width="2" stroke-dasharray="6 4"/><text x="' + mxp + '" y="' + (T - 8) + '" text-anchor="middle" style="fill:#D81B7A;font-weight:700">설정한 기댓값</text>'; }
  if (xTitle) s += '<text x="' + (L + pw / 2) + '" y="' + (h - 6) + '" text-anchor="middle">' + esc(xTitle) + '</text>';
  s += '<text x="14" y="' + (T + ph / 2) + '" transform="rotate(-90 14 ' + (T + ph / 2) + ')" text-anchor="middle">' + esc(yTitle) + '</text></svg>';
  return s;
}

function lineSvg(w, R0, names, p, showP, ymode, hl) {
  const h = 320, L = 52, R = 14, T = 16, B = 46, pw = w - L - R, ph = h - T - B, n = R0.n, m = names.length;
  let ymax = 1;
  if (ymode === 'auto') {
    let mx = 0; const from = Math.max(1, Math.ceil(n * 0.1));
    R0.xs.forEach((x, i) => { if (x >= from) for (let c = 0; c < m; c++) mx = Math.max(mx, R0.ys[c][i]); });
    if (showP && p) mx = Math.max(mx, Math.max.apply(null, p));
    const cand = [0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1]; mx = Math.max(mx * 1.12, 0.1);
    ymax = cand.find(v => v >= mx) || 1;
  }
  const X = t => L + pw * (t / n), Y = v => T + ph * (1 - v / ymax);
  let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="던진 횟수에 따른 상대도수 변화 꺾은선그래프"><defs><clipPath id="clipL"><rect x="' + L + '" y="' + T + '" width="' + pw + '" height="' + ph + '"/></clipPath></defs>';
  const ystep = ymax === 1 ? 0.25 : niceStep(ymax / 4);
  for (let v = 0; v <= ymax + 1e-9; v += ystep) { const y = Y(v); s += '<line class="gridl" x1="' + L + '" x2="' + (w - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + (Math.round(v * 1000) / 1000) + '</text>'; }
  s += '<line class="axis" x1="' + L + '" x2="' + (w - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '"/>';
  for (let i = 0; i <= 4; i++) { const t = Math.round(n * i / 4); s += '<text x="' + X(t) + '" y="' + (T + ph + 18) + '" text-anchor="middle">' + fmt(t) + '</text>'; }
  s += '<text x="' + (L + pw / 2) + '" y="' + (h - 6) + '" text-anchor="middle">던진 횟수(번)</text><text x="14" y="' + (T + ph / 2) + '" transform="rotate(-90 14 ' + (T + ph / 2) + ')" text-anchor="middle">상대도수</text>';
  s += '<g clip-path="url(#clipL)">';
  const many = m > PAL, pts = c => R0.xs.map((x, i) => X(x).toFixed(1) + ',' + Y(R0.ys[c][i]).toFixed(1)).join(' ');
  if (showP && p) p.forEach((v, c) => { s += '<line x1="' + L + '" x2="' + (w - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + col(c, m) + '" stroke-width="1.5" stroke-dasharray="6 5" opacity="' + (many ? '.35' : '.75') + '"/>'; });
  for (let c = 0; c < m; c++) { if (many && c === hl) continue; s += '<polyline fill="none" stroke="' + col(c, m) + '" stroke-width="' + (many ? 1.5 : 2) + '" opacity="' + (many ? '.4' : '1') + '" stroke-linejoin="round" points="' + pts(c) + '"/>'; }
  if (many && hl >= 0 && hl < m) s += '<polyline fill="none" stroke="#D81B7A" stroke-width="3" stroke-linejoin="round" points="' + pts(hl) + '"/>';
  s += '</g><line id="cross" x1="0" x2="0" y1="' + T + '" y2="' + (T + ph) + '" stroke="#2B0F3F" stroke-width="1" opacity="0"/>';
  s += '<rect id="hit" x="' + L + '" y="' + T + '" width="' + pw + '" height="' + ph + '" fill="transparent"/></svg>';
  return { svg: s, L: L, pw: pw, T: T };
}

function histBins(counts, n) {
  let lo = Math.min.apply(null, counts), hi = Math.max.apply(null, counts);
  lo = Math.max(0, lo - 1); hi = Math.min(n, hi + 1);
  const span = hi - lo + 1, wd = Math.max(1, Math.ceil(span / 30)), nb = Math.ceil(span / wd), bins = new Array(nb).fill(0);
  counts.forEach(c => { bins[Math.min(nb - 1, Math.floor((c - lo) / wd))]++; });
  const labels = bins.map((_, j) => { const a = lo + j * wd, b = Math.min(hi, a + wd - 1); return wd === 1 ? String(a) : a + '~' + b; });
  return { lo, hi, wd, bins, labels };
}

function wireLine(el, L, w) {
  const hit = $('#hit', el), cross = $('#cross', el), tip = $('.tip', el), R = S.once, names = S.exp.names;
  if (!hit) return;
  const move = ev => {
    const rect = el.getBoundingClientRect(), px = (ev.clientX - rect.left) * (w / rect.width);
    const t = Math.min(R.n, Math.max(1, Math.round((px - L.L) / L.pw * R.n)));
    let bi = 0, bd = 1e12; for (let i = 0; i < R.xs.length; i++) { const d = Math.abs(R.xs[i] - t); if (d < bd) { bd = d; bi = i; } }
    const x = L.L + L.pw * (R.xs[bi] / R.n);
    cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', '.5');
    const m = names.length, vals = R.ys.map(a => a[bi]);
    tip.innerHTML = '<b>' + fmt(R.xs[bi]) + '번째까지</b><br>' + (m > PAL
      ? '상대도수 ' + r3(Math.min.apply(null, vals)) + ' ~ ' + r3(Math.max.apply(null, vals)) + (S.hl >= 0 ? '<br><span style="color:#D81B7A">■</span> ' + esc(short(names[S.hl], 8)) + ' ' + r3(vals[S.hl]) : '<br>강조할 경우를 고르면 값이 보여요')
      : names.map((n, c) => '<span style="color:' + col(c, m) + '">■</span> ' + esc(short(n, 8)) + ' ' + r3(vals[c])).join('<br>'));
    tip.hidden = false;
    const tw = tip.offsetWidth, left = (x / w) * rect.width + 12;

  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { cross.setAttribute('opacity', '0'); tip.hidden = true; });
}

async function rollIdx(n) {
  const E = S.exp;
  if (!E.remote) return localRoll(E.p, n);
  const j = await api({ act: 'roll', id: E.remote.id, n });
  const s = String(j.r || ''); if (s.length !== n) throw new Error('bad');
  const out = new Uint8Array(n); for (let i = 0; i < n; i++) out[i] = s.charCodeAt(i) - 48;
  return out;
}
async function rollRep(n, k, pick) {
  const E = S.exp;
  if (!E.remote) {
    const idx = localRoll(E.p, n * k), c = new Array(k).fill(0);
    for (let r = 0; r < k; r++) { let x = 0; const b = r * n; for (let i = 0; i < n; i++) if (idx[b + i] === pick) x++; c[r] = x; }
    return c;
  }
  const j = await api({ act: 'rollk', id: E.remote.id, n, k, pick });
  if (!Array.isArray(j.c) || j.c.length !== k) throw new Error('bad');
  return j.c;
}

  const P = S.play; if (!P.pick || P.busy) return;
  P.busy = true; P.msg = ''; P.err = false; paintJudge();
  const bad = await needReady(); if (bad) { P.busy = false; P.msg = bad; P.err = true; paintJudge(); return; }
  try { const j = await api({ act: 'vote', id: P.id, uid: ME.uid, choice: P.pick }); P.my = j.my; P.tally = j.tally; listCount = null; S.list.items = null; if (j.already) toast('이미 판단한 실험이에요. 처음 고른 것으로 보여 줄게요.'); }
  catch (e) { P.msg = errText(e); P.err = true; }
  P.busy = false; paintJudge();
}

/* ---------- 화면 전환 ---------- */
function render() {
  let html = '';
  if (S.screen === 'home') { setSub('내가 만드는 확률 실험'); html = homeHtml(); }
  else if (S.screen === 'build') { setSub(S.mode === 'equal' ? '각 경우가 발생할 가능성이 동등한 경우' : '각 경우가 발생할 가능성이 동등하지 않은 경우'); html = buildHtml(); }
  else if (S.screen === 'lab') { setSub('확률 실험하기'); html = labHtml(); }
  else if (S.screen === 'list') { setSub('우리 학교 실험 판정하기'); html = listHtml(); }
  else if (S.screen === 'play') { setSub('친구가 올린 실험'); html = labHtml(); }
  app.innerHTML = html;
  if (S.screen === 'lab' || S.screen === 'play') { paintOnce(); paintRep(); paintPub(); paintJudge(); }
}
function startExperiment() {
  const ck = checkBuild(); if (!ck.ok) return;
  S.exp = { tool: S.tool.trim(), names: S.cases.map(c => c.name.trim()), p: ck.p, remote: null };
  S.once = null; S.rep = null; S.pick = 0; S.hl = -1; S.ran = false; S.tab = 'once'; S.showTrue = false; S.pub = { open: false, busy: false, id: null, key: '', msg: '', err: false };
  S.screen = 'lab'; render(); window.scrollTo(0, 0);
}

app.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v, i = Number(b.dataset.i);
  if (a === 'mode') { S.mode = v; defaults(v); S.screen = 'build'; render(); window.scrollTo(0, 0); }
  else if (a === 'home') { S.screen = 'home'; render(); }
  else if (a === 'add') { if (S.cases.length < MAX_CASES) { S.cases.push({ name: '', w: '' }); S.touched = true; render(); const r = $$('.cn'); r[r.length - 1].focus(); r[r.length - 1].select(); } }
  else if (a === 'ex') { S.exIdx = i; if (isBlankAll()) S.cases = blankRows(EX.unequal[i].cases.length); render(); }
  else if (a === 'del') { if (S.cases.length > MIN_CASES) { S.cases.splice(i, 1); render(); } }
  else if (a === 'fix') {
    const w = S.cases.map(c => parseW(c.w)), last = S.cases.length - 1;
    const others = w.slice(0, last).reduce((x, y) => x + (y > 0 ? y : 0), 0), rest = Math.round((1 - others) * 1e6) / 1e6;
    if (rest > 0) { S.cases[last].w = String(rest); render(); } else toast('앞의 값들의 합이 이미 1 이상이에요. 값을 줄여 주세요.');
  }
  else if (a === 'start') startExperiment();
  else if (a === 'rebuild') { S.screen = 'build'; render(); }
  else if (a === 'tab') { S.tab = v; $('#p-once').hidden = v !== 'once'; $('#p-rep').hidden = v !== 'rep'; $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === v))); drawCharts(); }
  else if (a === 'q1') { $('#n1').value = v; }
  else if (a === 'run1') runOnce();
  else if (a === 'run2') runRep();
  else if (a === 'pub-open') { S.pub.open = true; S.pub.msg = ''; paintPub(); }
  else if (a === 'pub-cancel') { S.pub.open = false; paintPub(); }
  else if (a === 'pub-do') publish();
  else if (a === 'list') { S.screen = 'list'; setSub('우리 학교 실험 판정하기'); loadItems(); window.scrollTo(0, 0); }
  else if (a === 'open') { const it = (S.list.items || []).find(x => x.id === b.dataset.id); if (it) openPlay(it); }
  else if (a === 'pickv') { S.play.pick = v; paintJudge(); }
  else if (a === 'vote') vote();
  else if (a === 'copy') {
    const url = location.origin + '/probability/sim/?e=' + b.dataset.id;
    try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요.'); } catch (e) { window.prompt('이 링크를 복사해 주세요', url); }
  }
  else if (a === 'remove') {
    if (!window.confirm('이 실험을 지울까요? 친구들의 판단 결과도 함께 지워져요.')) return;
    try { await api({ act: 'remove', id: b.dataset.id, uid: ME.uid }); toast('지웠어요.'); listCount = null; await loadItems(); } catch (e) { toast(errText(e)); }
  }
});
app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'tool') { S.tool = t.value; S.touched = true; updateBuild(); }
  else if (t.classList.contains('cn')) { S.cases[Number(t.dataset.i)].name = t.value; S.touched = true; updateBuild(); }
  else if (t.classList.contains('cw')) { S.cases[Number(t.dataset.i)].w = t.value; S.touched = true; updateBuild(); }
});
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'showTrue') { S.showTrue = t.checked; const lg = $('.exphead .chips'); if (lg) lg.outerHTML = legendHtml(S.exp.names, S.exp.p, S.showTrue); paintOnce(); paintRep(); }
  else if (t.id === 'ymode') { S.ymode = t.value; drawCharts(); }
  else if (t.id === 'hl') { S.hl = Number(t.value); drawCharts(); }
  else if (t.id === 'pick') { S.pick = Number(t.value); }
});
app.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  if (ev.target.id === 'n1') runOnce();
  else if (ev.target.id === 'n2' || ev.target.id === 'k2') runRep();
  else if (ev.target.id === 'tool' || ev.target.classList.contains('cn') || ev.target.classList.contains('cw')) { const g = $('#go'); if (g && !g.disabled) g.click(); }
});
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawCharts, 150); });
if (window.MtryuMeSync) MtryuMeSync.watch(async () => { await syncMe(); if (S.screen === 'list') loadItems(); });

/* ---------- 시작 ---------- */
(async function init() {
  render();
  if (location.protocol === 'file:') return;
  await loadList(); await syncMe();
  const e = new URLSearchParams(location.search).get('e');
  if (e && /^[a-f0-9]{10}$/.test(e)) {
    try { const j = await api({ act: 'get', id: e, uid: ME ? ME.uid : '' }); openPlay(j.item); } catch (er) { toast(errText(er)); }
    return;
  }
  if (ME) { try { const j = await api({ act: 'list', year: YEAR, school: ME.label, uid: ME.uid }); listCount = (j.items || []).length; if (S.screen === 'home') render(); } catch (er) {} }
})();
})();
</script>
