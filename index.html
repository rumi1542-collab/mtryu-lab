<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT RYU의 실험실</title>
<meta name="description" content="수학 실험실, 통계 실험실, 게임 수학 실험실 — 만지고 움직이며 배우는 수학 실험실">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.cta:hover{opacity:.9}
.navlink:hover{background:#E4E9F7}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<div id="top" style="min-height: 100vh; box-sizing: border-box; background-color: #F7F8FC; background-image: linear-gradient(#E3E7F3 1px, transparent 1px), linear-gradient(90deg, #E3E7F3 1px, transparent 1px); background-size: 32px 32px; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1B2340; display: flex; flex-direction: column; align-items: center; padding: 0 16px 56px 16px">
<div style="width: 100%; max-width: 1040px; display: flex; flex-direction: column; gap: 56px">

<!-- 상단 바 -->
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 24px">
<a href="#top" style="display: flex; align-items: center; min-height: 44px; text-decoration: none; color: #1B2340; font-size: 20px; font-weight: 900">MT RYU의 실험실</a>
<nav style="display: flex; flex-wrap: wrap; gap: 4px">
<a class="navlink" href="#math" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; text-decoration: none; color: #1B2340; font-size: 15px; font-weight: 700">수학 실험실</a>
<a class="navlink" href="#stat" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; text-decoration: none; color: #1B2340; font-size: 15px; font-weight: 700">통계 실험실</a>
<a class="navlink" href="#game" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; text-decoration: none; color: #1B2340; font-size: 15px; font-weight: 700">게임 수학 실험실</a>
</nav>
</div>

<!-- 히어로 -->
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<h1 style="margin: 0; font-size: clamp(32px, 5vw, 48px); line-height: 1.25; font-weight: 900">만지고 움직이며<br>배우는 수학 실험실</h1>
<p style="margin: 0; max-width: 480px; font-size: 17px; line-height: 1.6; color: #3B4262">탐구하고 싶은 실험실을 골라 보세요.</p>
</div>

<!-- 실험실 카드 -->
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">

<section id="math" style="flex: 1 1 260px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 2px solid #1B2340; border-radius: 16px; padding: 20px; box-shadow: 4px 4px 0 #2F5BEA">
<span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #E4EBFD">
<svg width="28" height="28" viewBox="0 0 40 40" fill="none" stroke="#2F5BEA" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
<path d="M10 5v10M5 10h10"/>
<path d="M25 10h10"/>
<path d="M26 26l8 8M34 26l-8 8"/>
<path d="M25 30h10"/>
</svg>
</span>
<h2 style="margin: 0; font-size: 20px; font-weight: 900">수학 실험실</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; color: #3B4262">
<li>기초 연산 무한 훈련</li>
<li>문자와 식 대수타일</li>
<li>수와 식 무한 훈련</li>
<li>도형의 닮음 탐구</li>
<li>예각의 삼각비 탐구</li>
</ul>
<a class="cta" href="https://rumi1542-collab.github.io/mathoperation/" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #2F5BEA; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">입장하기</a>
</section>

<section id="stat" style="flex: 1 1 260px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 2px solid #1B2340; border-radius: 16px; padding: 20px; box-shadow: 4px 4px 0 #0A7A6B">
<span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #DCF1EC">
<svg width="28" height="28" viewBox="0 0 40 40" fill="none" stroke="#0A7A6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M5 34h30"/>
<path d="M10 34V22M20 34V10M30 34V17"/>
</svg>
</span>
<h2 style="margin: 0; font-size: 20px; font-weight: 900">통계 실험실</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; color: #3B4262">
<li>문제 설정</li>
<li>자료 수집</li>
<li>자료 분석</li>
<li>결과 해석</li>
</ul>
<a class="cta" href="https://rumi1542-collab.github.io/dataandstat/" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #0A7A6B; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">입장하기</a>
</section>

<section id="game" style="flex: 1 1 260px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; border: 2px solid #1B2340; border-radius: 16px; padding: 20px; box-shadow: 4px 4px 0 #C2461A">
<span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #FBE5DB">
<svg width="30" height="28" viewBox="0 0 44 40" fill="none" stroke="#C2461A" stroke-width="3" aria-hidden="true">
<rect x="2" y="6" width="40" height="28" rx="14"/>
<circle cx="14" cy="14" r="3.2"/>
<circle cx="22" cy="14" r="3.2"/>
<circle cx="30" cy="14" r="3.2"/>
<circle cx="14" cy="26" r="3.2"/>
<circle cx="22" cy="26" r="3.2"/>
<circle cx="30" cy="26" r="3.2"/>
</svg>
</span>
<h2 style="margin: 0; font-size: 20px; font-weight: 900">게임 수학 실험실</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.45; color: #3B4262">
<li>만칼라 튜토리얼</li>
</ul>
<a class="cta" href="https://mancala-tutorial.vercel.app" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #C2461A; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">입장하기</a>
</section>

</div>

<p style="margin: 0; text-align: center; font-size: 15px; font-weight: 500; color: #3B4262">틀려도 괜찮아요! 직접 조작해 보며 배우는 여러분의 용기를 응원합니다.</p>

</div>
</div>
</body>
</html>
